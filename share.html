<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>울산 AS 동선 지도 — 엑셀 올리면 바로</title>
<meta name="theme-color" content="#0e1316" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eceeed" media="(prefers-color-scheme: light)">
<meta name="description" content="MAS 접수 엑셀 파일을 올리면 브라우저 안에서 바로 지도와 동선이 뜨는 공유용 페이지">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ── 토큰: 기존 개인용 지도(v12)와 같은 절제된 딥그린 + 차콜, 유리 표면 ───── */
:root{
  --bg:#eceeed; --panel:#ffffff; --panel-2:#f5f6f5; --ink:#0e1412; --muted:#69756f; --line:rgba(14,24,20,.10);
  --accent:#0d5a49; --accent-ink:#ffffff; --accent-soft:rgba(13,90,73,.10);
  --done:#93a09b; --warn:#9f561a; --warn-soft:rgba(159,86,26,.12);
  --glass:rgba(255,255,255,.74); --glass-drop:rgba(255,255,255,.42); --sheet:#ffffff;
  --sh-1:0 1px 2px rgba(12,22,18,.05),0 1px 1px rgba(12,22,18,.04);
  --sh-2:0 2px 8px rgba(12,22,18,.06),0 12px 28px rgba(12,22,18,.09);
  --sh-3:0 -1px 0 rgba(12,22,18,.04),0 -12px 34px rgba(12,22,18,.13);
  --tnam-bg:#e6f1ec; --tnam-ink:#14614c; --tjung-bg:#f8f0dc; --tjung-ink:#7a5a16;
  --tbuk-bg:#e8eef6; --tbuk-ink:#2b5474; --tdong-bg:#f9e9ef; --tdong-ink:#7d3550;
  --tetc-bg:#eef0ef; --tetc-ink:#5c6864;
  --pin-nam:#0d5a49; --pin-jung:#a8761f; --pin-buk:#2b5474; --pin-dong:#8c3f5e; --pin-etc:#6c7873;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1316; --panel:#151c21; --panel-2:#1a2329; --ink:#e9eeec; --muted:#8d9a98; --line:rgba(255,255,255,.09);
    --accent:#7cc0a6; --accent-ink:#07130f; --accent-soft:rgba(124,192,166,.14);
    --done:#6b7877; --warn:#d9a06a; --warn-soft:rgba(217,160,106,.14);
    --glass:rgba(18,25,29,.72); --glass-drop:rgba(18,25,29,.34); --sheet:#121920;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 10px rgba(0,0,0,.45),0 14px 30px rgba(0,0,0,.35);
    --sh-3:0 -1px 0 rgba(255,255,255,.05),0 -12px 34px rgba(0,0,0,.5);
    --tnam-bg:rgba(124,192,166,.16); --tnam-ink:#93cfb8; --tjung-bg:rgba(216,186,120,.14); --tjung-ink:#dcc088;
    --tbuk-bg:rgba(124,166,214,.14); --tbuk-ink:#9dc0e2; --tdong-bg:rgba(214,140,168,.14); --tdong-ink:#e0a8bd;
    --tetc-bg:rgba(255,255,255,.06); --tetc-ink:#94a1a0;
    --pin-nam:#7cc0a6; --pin-jung:#dcc088; --pin-buk:#9dc0e2; --pin-dong:#e0a8bd; --pin-etc:#9aa5a1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1316; --panel:#151c21; --panel-2:#1a2329; --ink:#e9eeec; --muted:#8d9a98; --line:rgba(255,255,255,.09);
  --accent:#7cc0a6; --accent-ink:#07130f; --accent-soft:rgba(124,192,166,.14);
  --done:#6b7877; --warn:#d9a06a; --warn-soft:rgba(217,160,106,.14);
  --glass:rgba(18,25,29,.72); --glass-drop:rgba(18,25,29,.34); --sheet:#121920;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 10px rgba(0,0,0,.45),0 14px 30px rgba(0,0,0,.35);
  --sh-3:0 -1px 0 rgba(255,255,255,.05),0 -12px 34px rgba(0,0,0,.5);
  --tnam-bg:rgba(124,192,166,.16); --tnam-ink:#93cfb8; --tjung-bg:rgba(216,186,120,.14); --tjung-ink:#dcc088;
  --tbuk-bg:rgba(124,166,214,.14); --tbuk-ink:#9dc0e2; --tdong-bg:rgba(214,140,168,.14); --tdong-ink:#e0a8bd;
  --tetc-bg:rgba(255,255,255,.06); --tetc-ink:#94a1a0;
  --pin-nam:#7cc0a6; --pin-jung:#dcc088; --pin-buk:#9dc0e2; --pin-dong:#e0a8bd; --pin-etc:#9aa5a1;
  color-scheme:dark;
}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;letter-spacing:-.005em}
button,select,input{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}

/* ── 구조: 상단 지도 + 하단 시트 ──────────────────────────────────────── */
main{position:absolute;inset:0;overflow:hidden;--map-r:55;--sheet-h:calc((100 - var(--map-r)) * 1%);--bleed:22px;--head-h:120px}
.mapwrap{position:absolute;left:0;right:0;top:0;bottom:calc(var(--sheet-h) - var(--bleed));overflow:hidden;z-index:1;background:var(--bg)}
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-container{background:var(--bg);font-family:var(--font);outline:none}
.leaflet-tile-pane{filter:saturate(.6) brightness(1.04) contrast(.96)}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) saturate(.5) brightness(.9) contrast(.95)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) saturate(.5) brightness(.9) contrast(.95)}}
.leaflet-control-attribution{display:none}
/* 지도 위 부유 컨트롤 */
.zoom{position:absolute;right:12px;bottom:calc(12px + var(--bleed));display:flex;flex-direction:column;gap:6px;z-index:900}
.zoom button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);padding:0;cursor:pointer;
  background:var(--glass);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  color:var(--ink);font-size:18px;font-weight:500;line-height:1;box-shadow:var(--sh-2);transition:transform .12s ease}
.zoom button:active{transform:scale(.94)}
.zoom button.zf{font-size:11.5px;font-weight:600;letter-spacing:-.01em}
.legend{position:absolute;left:12px;bottom:calc(12px + var(--bleed));z-index:900;display:flex;gap:4px 10px;align-items:center;flex-wrap:wrap;
  background:var(--glass);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:11px;color:var(--muted);box-shadow:var(--sh-1);max-width:calc(100% - 118px)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.legend .attr{color:var(--muted);font-size:10px;opacity:.7;text-decoration:none;white-space:nowrap}
.geopill{position:absolute;left:12px;top:calc(var(--head-h) + 8px);z-index:920;display:flex;align-items:center;gap:8px;
  background:var(--glass);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 11px;font-size:11.5px;font-weight:600;color:var(--ink);box-shadow:var(--sh-2)}
.geopill .bar{width:52px;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.geopill .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.geopill button{border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:11px;font-weight:600;
  padding:4px 8px;border-radius:999px;cursor:pointer}
.rtip{font-size:11.5px;line-height:1.6;color:var(--muted);background:var(--warn-soft);border-radius:11px;
  padding:8px 11px;margin:0 0 9px}
.rtip b{color:var(--warn);font-weight:700}

/* ── 상단 유리 헤더 ────────────────────────────────────────────────── */
header{position:absolute;left:0;right:0;top:0;z-index:500;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;
  background:linear-gradient(180deg,var(--glass) 0%,var(--glass) 62%,var(--glass-drop) 100%);
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;min-width:0}
h1{font-size:16.5px;font-weight:700;margin:0;letter-spacing:-.03em;white-space:nowrap;flex:0 0 auto}
.asof{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1 1 auto;text-align:right;letter-spacing:-.01em;padding-left:6px}
.mini{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
  padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--muted);cursor:pointer;transition:transform .12s,color .18s}
.mini:active{transform:scale(.95);color:var(--ink)}
.mini[hidden]{display:none}
.bar{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bar[hidden]{display:none}
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:1px 0}
.chiprow::-webkit-scrollbar{display:none}
button.chip{flex:0 0 auto;font-size:12px;font-weight:600;letter-spacing:-.015em;padding:0 11px;height:30px;
  display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .12s ease,background .18s ease,color .18s ease}
button.chip:active{transform:scale(.96)}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.chip.act{background:var(--panel-2);color:var(--muted)}
button.chip.act[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip .n{opacity:.55;font-variant-numeric:tabular-nums;margin-left:4px;font-weight:600}
button.chip[aria-pressed="true"] .n{opacity:.75}

/* ── 하단 시트(목록) ──────────────────────────────────────────────── */
.side{position:absolute;left:0;right:0;bottom:0;height:var(--sheet-h);z-index:600;scrollbar-width:none;
  background:var(--sheet);border-radius:22px 22px 0 0;box-shadow:var(--sh-3);border-top:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:34px 14px calc(22px + env(safe-area-inset-bottom,0px))}
.side::-webkit-scrollbar{width:0;height:0}
.splitter{position:absolute;left:0;right:0;bottom:calc(var(--sheet-h) - 28px);height:28px;z-index:610;
  display:flex;align-items:center;justify-content:center;cursor:row-resize;touch-action:none;user-select:none;background:transparent}
.splitter .sgrip{width:34px;height:4px;border-radius:999px;background:var(--line);transition:background .15s,width .15s}
.splitter:hover .sgrip,.splitter.on .sgrip{background:var(--muted);width:44px}
.splitter .sbtn{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;
  line-height:1;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--muted);cursor:pointer}
.splitter .sbtn:active,.splitter .sbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.splitter[hidden]{display:none}
body.splitting{user-select:none}

h2{font-size:12.5px;font-weight:600;color:var(--muted);margin:16px 2px 9px;display:flex;align-items:baseline;
  justify-content:space-between;letter-spacing:-.01em}
h2:first-child{margin-top:2px}
h2 b{color:var(--ink);font-weight:700;font-size:14.5px;letter-spacing:-.03em}
h2 span{font-variant-numeric:tabular-nums;font-size:11.5px}

/* 파일 정보 줄 */
.fbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 11px;border:1px solid var(--line);
  border-radius:13px;background:var(--panel-2);margin:0 0 8px}
.fbar .fname{font-size:11.5px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.fbar select{font-size:11.5px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:4px 6px;max-width:190px}
.fbar .sp{flex:1 1 auto}
.fbar button{font-size:11px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:4px 9px;cursor:pointer}
.fbar button:active{color:var(--ink)}
.fcols{font-size:10.5px;color:var(--muted);margin:-2px 2px 10px;line-height:1.5}
.sampleflag{font-size:10.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:8px;
  padding:3px 8px;letter-spacing:-.01em}

/* 고객 카드 */
.cardrow{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:11px 12px 12px;margin:0 0 9px;cursor:pointer;
  box-shadow:var(--sh-1);transition:transform .13s ease,box-shadow .18s ease,border-color .18s ease}
.cardrow:active{transform:scale(.987);box-shadow:none}
.cardrow.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--sh-2)}
.cardrow.done{opacity:.94;box-shadow:none}
.cr-top{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:nowrap;overflow:hidden}
.badge{display:inline-flex;align-items:center;flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:-.01em;
  padding:3px 7px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.badge.done{background:var(--panel-2);color:var(--muted);border:1px solid var(--line);font-weight:600}
.badge.tel{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:600}
:root{--d-mon:#2b4c7e;--d-mon-i:#fff;--d-tue:#0d5a49;--d-tue-i:#fff;--d-wed:#0e6674;--d-wed-i:#fff;
  --d-thu:#8a4b2a;--d-thu-i:#fff;--d-fri:#6b3554;--d-fri-i:#fff;--d-sat:#475569;--d-sat-i:#fff;--d-sun:#7c3a3a;--d-sun-i:#fff;
  --d-unv-bg:#e4ede9;--d-unv-ink:#33564b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --d-mon:#a9c6e8;--d-mon-i:#0a1418;--d-tue:#7cc0a6;--d-tue-i:#08140f;--d-wed:#8ecfd6;--d-wed-i:#08161a;
  --d-thu:#d9bd8a;--d-thu-i:#1a1206;--d-fri:#c6b1dc;--d-fri-i:#150f1a;--d-sat:#b3c2d4;--d-sat-i:#0c1318;--d-sun:#e0b0ab;--d-sun-i:#1a0d0c;
  --d-unv-bg:rgba(124,192,166,.13);--d-unv-ink:#9fd0bb}}
:root[data-theme="dark"]{
  --d-mon:#a9c6e8;--d-mon-i:#0a1418;--d-tue:#7cc0a6;--d-tue-i:#08140f;--d-wed:#8ecfd6;--d-wed-i:#08161a;
  --d-thu:#d9bd8a;--d-thu-i:#1a1206;--d-fri:#c6b1dc;--d-fri-i:#150f1a;--d-sat:#b3c2d4;--d-sat-i:#0c1318;--d-sun:#e0b0ab;--d-sun-i:#1a0d0c;
  --d-unv-bg:rgba(124,192,166,.13);--d-unv-ink:#9fd0bb}
.badge.dow-mon{background:var(--d-mon);color:var(--d-mon-i)}
.badge.dow-tue{background:var(--d-tue);color:var(--d-tue-i)}
.badge.dow-wed{background:var(--d-wed);color:var(--d-wed-i)}
.badge.dow-thu{background:var(--d-thu);color:var(--d-thu-i)}
.badge.dow-fri{background:var(--d-fri);color:var(--d-fri-i)}
.badge.dow-sat{background:var(--d-sat);color:var(--d-sat-i)}
.badge.dow-sun{background:var(--d-sun);color:var(--d-sun-i)}
.badge.unv{background:var(--d-unv-bg);color:var(--d-unv-ink);border:1px solid var(--line);font-weight:600}
.gtag{font-size:10.5px;font-weight:600;letter-spacing:-.01em;padding:3px 7px;border-radius:7px;white-space:nowrap;flex:0 0 auto}
.gtag.g-nam{background:var(--tnam-bg);color:var(--tnam-ink)}
.gtag.g-jung{background:var(--tjung-bg);color:var(--tjung-ink)}
.gtag.g-buk{background:var(--tbuk-bg);color:var(--tbuk-ink)}
.gtag.g-dong{background:var(--tdong-bg);color:var(--tdong-ink)}
.gtag.g-etc{background:var(--tetc-bg);color:var(--tetc-ink)}
.mtag{margin-left:auto;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:10.5px;font-weight:500;color:var(--muted);padding:3px 7px;border-radius:7px;background:var(--panel-2);
  border:1px solid var(--line);letter-spacing:-.01em}
.rnum-b{flex:0 0 auto;width:17px;height:17px;border-radius:50%;background:var(--warn);color:#fff;font-size:10px;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .rnum-b{color:#1a1206}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rnum-b{color:#1a1206}}
.cr-name{font-size:15.5px;font-weight:650;letter-spacing:-.03em;line-height:1.25;color:var(--ink);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cr-name a.crcall{color:inherit;font:inherit;letter-spacing:inherit;text-decoration:underline;
  text-decoration-style:dotted;text-decoration-thickness:1px;text-underline-offset:3px;
  text-decoration-color:var(--accent)}
.cr-name a.crcall:active{opacity:.55}
.cr-ph{font-size:11px;line-height:1;opacity:.9}
.cr-sym{margin-top:3px;font-size:12px;line-height:1.5;color:var(--muted);letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.apx{font-size:10px;font-weight:600;color:var(--muted);margin-left:5px;opacity:.8}

/* 선택한 건 상세 카드 */
.card{position:relative;border:1px solid var(--accent);border-radius:16px;padding:14px 14px 12px;margin:2px 0 14px;
  display:flex;flex-direction:column;gap:5px;background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft),var(--sh-2)}
.card .chead{display:flex;align-items:center;gap:8px;margin:0 0 3px}
.card .chead .clab{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--accent)}
.card .chead .xclose{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;min-width:88px;padding:0 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer}
.card .chead .xclose:active{transform:scale(.97);background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.card .chead .xclose .xi{font-size:15px;font-weight:700;line-height:1}
.card .nm{font-size:17px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card .nm a.nmcall{color:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;
  text-decoration-color:var(--accent)}
.card .meta{color:var(--muted);font-size:12.5px;letter-spacing:-.01em}
.card .meta b{color:var(--ink);font-weight:650}
.card .meta a.tellink{color:var(--ink);font-weight:650;text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:3px;text-decoration-color:var(--accent)}
.card .symtxt{font-size:13px;line-height:1.6;margin-top:2px;white-space:pre-wrap;word-break:break-word}

  if(typeof v==="number"){ if(v>0&&v<1){const t=Math.round(v*1440);return pad(Math.floor(t/60)%24)+":"+pad(t%60)} return ""; }
  const s=String(v);
  const m=s.match(/(\d{1,2})\s*[:시]\s*(\d{1,2})/);
  if(m) return pad(+m[1])+":"+pad(+m[2]);
  if(/^\d{1,2}$/.test(s.trim())&&+s<=23) return pad(+s)+":00";
  return "";
}

/* ── 주소 → 구·동 ─────────────────────────────────────────────────── */
function normGu(v){
  const s=String(v||"");
  const m=s.match(/([남중북동])구/);
  if(m) return m[1]+"구";
  if(/울산/.test(s)&&/^[남중북동]$/.test(s.trim())) return s.trim()+"구";
  return "";
}
function guFromAddr(addr){const m=String(addr||"").match(/울산(?:광역시|시)?\s*([남중북동])구/);return m?m[1]+"구":""}
function dongCands(addr){
  const out=[];const re=/([가-힣]{1,6}동)(?![가-힣])/g;let m;
  while((m=re.exec(String(addr||"")))) out.push(m[1]);
  return out;
}
function centerOf(gu,name){
  const g=DONGS[gu]||{};if(!name)return null;
  if(g[name]) return g[name];
  const legal=(LEGAL[gu]||{})[name];
  if(!legal) return null;
  const arr=Array.isArray(legal)?legal:[legal];
  const cs=arr.map(n=>g[n]).filter(Boolean);
  if(!cs.length) return null;
  return [cs.reduce((s,p)=>s+p[0],0)/cs.length, cs.reduce((s,p)=>s+p[1],0)/cs.length];
}
function resolvePlace(addr,guCol){
  const gu=normGu(guCol)||guFromAddr(addr);
  const cands=dongCands(addr);
  for(let i=cands.length-1;i>=0;i--){
    const c=cands[i];
    if(gu){const p=centerOf(gu,c);if(p) return {gu,dong:c,pos:p};}
    for(const g of GUS){if(g===gu) continue;const p=centerOf(g,c);if(p) return {gu:g,dong:c,pos:p}}
  }
  // 동 이름을 못 찾으면 이름을 지어내지 않는다(주소 검색이 정확 위치를 잡는다)
  return {gu:gu||"기타",dong:"",pos:null};
}

/* ── 목록/필터 ────────────────────────────────────────────────────── */
const isDay=it=>!!(it.date&&it.date.iso);
function visible(){
  return S.items.filter(it=>{
    if(S.gu!=="전체"&&it.gu!==S.gu) return false;
    if(S.mode==="up"&&it.k!=="up"&&it.k!=="pending") return false;
    if(S.day){
      if(S.day==="free") return it.k==="pending";
      return isDay(it)&&it.date.iso===S.day;
    }
    return true;
  });
}
function dayList(){
  const ds=[...new Set(S.items.filter(isDay).map(i=>i.date.iso))].sort((a,b)=>dayOrd(a)-dayOrd(b));
  return ds;
}
function mins(t){const m=String(t||"").match(/^(\d{1,2}):(\d{2})$/);return m?(+m[1])*60+ +m[2]:null}
const byTime=(a,b)=>{
  const rank=x=>x.k==="up"?0:(x.k==="pending"?1:2);
  if(rank(a)!==rank(b)) return rank(a)-rank(b);
  if(a.k==="done"||a.k==="cancel"){
    return (dayOrd(b.date&&b.date.iso)-dayOrd(a.date&&a.date.iso))||String(a.name||"").localeCompare(String(b.name||""));
  }
  return ((isDay(a)?0:1)-(isDay(b)?0:1))
    ||(isDay(a)&&isDay(b)?(dayOrd(a.date.iso)-dayOrd(b.date.iso))||((mins(a.time)==null)-(mins(b.time)==null))||((mins(a.time)||0)-(mins(b.time)||0)):0)
    ||String(a.name||"").localeCompare(String(b.name||""));
};
function routeDateOf(){
  if(S.day&&S.day!=="free") return S.day;
  const ds=dayList();return ds.length?ds[0]:null;
}
function routePts(){
  const d=routeDateOf();if(!d) return [];
  return S.items.filter(i=>i.k==="up"&&isDay(i)&&i.date.iso===d).sort((a,b)=>((mins(a.time)||0)-(mins(b.time)||0)));
}
function whenText(it){
  if(it.k==="pending") return "미확정";
  if(it.k==="cancel") return (isDay(it)?labelOf(it.date.iso):"취소")+" 취소";
  if(!isDay(it)) return it.k==="done"?"완료":"날짜 미정";
  return labelOf(it.date.iso)+(it.time?" "+it.time:"")+(it.k==="done"?" 완료":"");
}
function dowClass(it){
  if(it.k!=="up") return it.k==="pending"?" unv":" done";
  const d=isDay(it)?dowOf(it.date.iso):"";
  return d?(" dow-"+DOWK[d]):" unv";
}

    (d==="free"?it.k==="pending":(isDay(it)&&it.date.iso===d))).length;

/* ── 엑셀 파싱: 머리글 자동 인식 ──────────────────────────────────── */
const FIELDS={
  no:["접수번호","as접수번호","접수no","as번호","접수"],
  name:["고객명","고객","성명","이름","고객이름","수령인"],
  addr:["주소","상세주소","고객주소","방문주소","설치주소","주소지","설치장소"],
  tel:["증상접수연락처","전화번호","연락처","휴대폰","핸드폰","휴대전화","전화","고객연락처"],
  date:["방문예정일시","방문일시","방문일정","예약일시","방문예정일","예정일시","방문일자","방문날짜","예약일","일정","날짜"],
  time:["방문시간","예약시간","시간"],
  gu:["지역구","시군구","지역","구"],
  dong:["행정동","법정동","읍면동","동"],
  model:["접수모델","모델명","제품명","모델","제품"],
  sym:["불량증상","고장증상","증상","요청사항","특이사항","내용"],
  note:["비고/동선메모","동선메모","비고","메모"],
  status:["진행상태","처리상태","상태","진행"],
  kind:["구분"],
  lat:["위도","y좌표","lat","latitude"],
  lng:["경도","x좌표","lng","lon","longitude"]
};
const FIELD_ORDER=["no","name","addr","tel","date","time","gu","dong","model","sym","note","status","kind","lat","lng"];
function headerMap(cells){
  const best={};
  cells.forEach((c,idx)=>{
    const n=norm(c);if(!n||n.length>24) return;
    let field=null,score=0;
    for(const f of FIELD_ORDER){
      for(const syn of FIELDS[f]){
        let sc=0;
        if(n===syn) sc=3;
        else if(n.startsWith(syn)) sc=2;
        else if(n.includes(syn)) sc=1;
        if(sc>score){score=sc;field=f}
      }
    }
    if(!field||score<2) return;
    if(!best[field]||score>best[field].score)
      best[field]={idx,score};
  });
  // 같은 열이 두 필드에 잡히면 점수가 높은 쪽만 남긴다
  const used={};
  const out={};
  Object.keys(best).sort((a,b)=>best[b].score-best[a].score).forEach(f=>{
    const idx=best[f].idx;
    if(used[idx]!=null) return;
    used[idx]=1;out[f]=idx;
  });
  return out;
}
function isHeaderRow(m){
  const keys=Object.keys(m);
  if(!(m.name!=null||m.addr!=null||m.no!=null)) return false;
  if(keys.length>=3) return true;
  return keys.length===2&&(m.name!=null||m.addr!=null)&&(m.tel!=null||m.date!=null||m.no!=null);
}
function sectionOf(cells){
  const non=cells.filter(c=>c!=null&&String(c).trim()!=="");
  if(!non.length) return null;
  const joined=non.join(" ");
  // 📅 2026년 11월 23일 (월) 확정 일정 (1건)  /  11월 20일 (금)
  const m=joined.match(/(?:(\d{4})\s*년\s*)?(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*\(([월화수목금토일])\)/);
  const pend=/미확정|접수\s*대기|대기\s*현황/.test(joined);
  if(m&&non.length<=3){
    const y=m[1]?+m[1]:nearestYear(+m[2],+m[3]);
    return {iso:isoOf(y,+m[2],+m[3]),status:pend?"pending":"up"};
  }
  if(non.length<=2&&/^[📅📋📌\s]*.*(미확정|접수\s*대기)/.test(joined)) return {iso:null,status:"pending"};
  if(non.length<=2&&/확정\s*일정/.test(joined)) return {iso:null,status:"up"};
  return null;
}
function statusOf(v){
  const s=String(v||"");
  if(/취소/.test(s)) return "cancel";
  if(/미확정|대기|미처리|접수만/.test(s)) return "pending";
  if(/배정/.test(s)) return "up";                  // MAS '배정완료' = 아직 방문 전
  if(/처리완료|완료|종결/.test(s)) return "done";
  if(/확정|예정|방문/.test(s)) return "up";
  return "";
}
function buildCoordMap(sheets){
  const out={};
  sheets.forEach(sh=>{
    const rows=sh.rows||[];let map0=null;
    for(const row of rows.slice(0,25)){
      if(!row) continue;
      const cells=row.slice(0,14).map(v=>v==null?"":String(v).trim());
      const m=headerMap(cells);
      if(m.lat!=null&&m.lng!=null&&(m.no!=null||m.name!=null)){map0=m;break}
    }
    if(!map0) return;
    rows.forEach(row=>{
      if(!row) return;
      const no=row[map0.no!=null?map0.no:0];
      const key=String(no==null?"":no).replace(/\.0$/,"").trim();
      if(!/^\d{5,}$/.test(key)) return;
      const la=parseFloat(String(row[map0.lat]).replace(/[^0-9.\-]/g,""));
      const ln=parseFloat(String(row[map0.lng]).replace(/[^0-9.\-]/g,""));
      if(!isFinite(la)||!isFinite(ln)) return;
      if(la<33||la>39||ln<124||ln>132) return;
      out[key]=[la,ln];
    });
  });
  return out;
}
function parseSheet(rows,coordMap){
  const items=[];let mapping=null,sec={iso:null,status:"up"};let coordUsed=0;const seen={};
  const headerSeen={};
  (rows||[]).forEach((row,ri)=>{
    if(!row) return;
    const cells=row.map(v=>v==null?"":String(v).trim());
    if(!cells.some(c=>c)) return;
    const joined=cells.filter(Boolean).join(" ");
    const non=cells.filter(c=>c).length;
    if(non<=2&&joined.length>120) return;     // 안내문·제목 줄(칸 하나짜리 긴 문장)은 건이 아니다

    const sec2=sectionOf(cells);
    if(sec2){sec=sec2;return}

    const m=headerMap(cells);
    const mc=Object.keys(m).length;
    if(isHeaderRow(m)&&(m.name!=null||m.addr!=null)&&(m.no!=null||m.tel!=null||m.date!=null)
       &&(!mapping||mc>=4)){
      mapping=m;headerSeen[ri]=1;return;
    }
    if(!mapping) return;

    const g=i=>mapping[i]!=null?cells[mapping[i]]:"";
    const name=g("name");
    const addr=g("addr");
    const noRaw=g("no");
    const no=String(noRaw).replace(/\.0$/,"").trim();
    if(!name&&!addr&&!telOf(g("tel"))) return;
    if(/^(고객명|성명|이름|no|번호)$/i.test(name)) return;
    if(/^(주소|상세주소)$/.test(addr)&&!name) return;

    // 날짜/시간
    let dt=parseDateCell(mapping.date!=null?row[mapping.date]:null);
    const t2=parseTimeCell(mapping.time!=null?row[mapping.time]:null);
    let iso=dt&&dt.iso?dt.iso:sec.iso;
    let time=(dt&&dt.time)||t2||"";
    if(mapping.kind!=null){                     // 구분 열: "11/19 완료" 처럼 날짜가 섞여 있으면 날짜로 쓴다
      const kk=parseDateCell(row[mapping.kind]);
      if(kk&&kk.iso&&!iso) iso=kk.iso;
    }
    // 상태
    let k=statusOf(g("status"));
    if(mapping.kind!=null&&!k) k=statusOf(g("kind"));
    if(!k) k=sec.status||"up";
    const dateTxt=String(mapping.date!=null?row[mapping.date]:"")+" "+String(mapping.time!=null?row[mapping.time]:"");
    if(k==="up"&&!iso&&/미확정|미정/.test(dateTxt)) k="pending";

    const place=resolvePlace(addr,g("gu"));
    const gu=place.gu;
    let lat=null,lng=null,exact=false;
    const fileC=no&&coordMap&&coordMap[no]?coordMap[no]:null;
    let src=null;
    if(fileC){lat=fileC[0];lng=fileC[1];exact=true;coordUsed++;src="file"}
    else if(mapping.lat!=null&&mapping.lng!=null){
      const la=parseFloat(String(row[mapping.lat]).replace(/[^0-9.\-]/g,""));
      const ln=parseFloat(String(row[mapping.lng]).replace(/[^0-9.\-]/g,""));
      if(isFinite(la)&&isFinite(ln)&&la>33&&la<39&&ln>124&&ln<132){lat=la;lng=ln;exact=true;coordUsed++;src="col"}
    }
    if(lat==null&&place.pos){lat=place.pos[0];lng=place.pos[1];exact=false;src="dong"}

    const key=no?("no:"+no):("nm:"+(name||"")+"|"+(iso||"")+"|"+(time||""));
    if(seen[key]) return;
    seen[key]=1;

    const tel=telOf(g("tel"));
    const item={
      k, no:no||"", name:name||"", addr:addr||"", tel,
      gu, dong: place.dong||g("dong")||"",
      model:g("model"), sym:g("sym"), note:g("note"),
      date: iso?{iso}:null, time,
      pos: lat!=null?{lat,lng,exact,src:src}:null,
      _i:items.length
    };
    if(!item.dong) item.dong=(LEGAL[gu]&&Object.keys(LEGAL[gu]).find(d=>addr.indexOf(d)>=0))||"";
    items.push(item);
  });
  return {items,mapping,coordUsed};
}

/* ── 주소 지오코딩 (Nominatim, 1초에 1건) ───────────────────────────── */
const geoCache={};
function roadQuery(addr){
  let a=String(addr||"").replace(/\[\d{5}\]/g," ").replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim();
  let m=a.match(/^(.*?(?:로|길|동)\s*\d+(?:-\d+)?)/);
  let base=m?m[1]:a;
  base=base.replace(/\s*\d+동\s*\d+호$/,"").replace(/\s*\d+호$/,"").replace(/\s*\d+층$/,"").trim();
  if(!base) return "";
  if(!/울산|부산|경남|양산|김해|창원/.test(base)) base="울산 "+base;
  return base;
}
async function nominatim(q){
  const url="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr&accept-language=ko&q="+encodeURIComponent(q);
  const r=await fetch(url,{headers:{Accept:"application/json"},referrerPolicy:"strict-origin-when-cross-origin"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json();
  if(!j||!j.length) return null;
  const lat=+j[0].lat,lng=+j[0].lon;
  if(!isFinite(lat)||!isFinite(lng)) return null;
  return {lat,lng};
}
function setGeoUI(shot,total){
  const pill=$("#geopill");
  if(!total){pill.hidden=true;return}
  pill.hidden=false;
  $("#geotext").textContent="주소 맞추는 중 "+shot+"/"+total;
  $("#geobar").style.width=Math.round(shot/total*100)+"%";
}
async function startGeocode(){
  const run=++S.geoRun;
  setGeoUI(0,0);
  if(!S.useGeo) return;
  const pri=it=>it.k==="up"?0:it.k==="pending"?1:it.k==="done"?2:3;
  const need=S.items.filter(i=>i.addr&&(!i.pos||!i.pos.exact)&&roadQuery(i.addr))
    .sort((a,b)=>pri(a)-pri(b));
  if(!need.length) return;
  let done=0,fails=0,stopped=false;
  setGeoUI(0,need.length);
  for(const it of need){
    if(run!==S.geoRun){stopped=true;break}
    const q=roadQuery(it.addr);
    try{
      let r=geoCache[q];
      if(r===undefined){
        await sleep(1050);
        if(run!==S.geoRun){stopped=true;break}
        r=await nominatim(q);
        geoCache[q]=r||null;
      }
      if(run!==S.geoRun){stopped=true;break}
      fails=0;
      if(r){
        it.pos={lat:r.lat,lng:r.lng,exact:true,src:"geo"};
        renderPins();
      }
    }catch(err){
      fails++;
      if(fails>=2){                       // 네트워크·CORS가 막히면 더 시도하지 않는다
        const pill=$("#geopill");
        if(pill){$("#geotext").textContent="주소 검색이 막혀 동 중심으로 표시합니다";setTimeout(()=>{if(run===S.geoRun)pill.hidden=true},4200)}
        stopped=true;break;
      }
    }
    done++;
    setGeoUI(done,need.length);
  }
  if(run!==S.geoRun) return;
  setTimeout(()=>{if(run===S.geoRun)$("#geopill").hidden=true},stopped?0:900);
  if(!stopped) fitVisible();
  drawSide();
}
$("#geocancel").onclick=()=>{S.geoRun++;$("#geopill").hidden=true};

/* ── 샘플 데이터 ──────────────────────────────────────────────────── */
function loadSample(){ loadSampleNow(); }
function loadSampleNow(){
  const now=new Date();
  const d0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const d1=new Date(d0.getTime()+864e5);
  const iso=d=>isoOf(d.getFullYear(),d.getMonth()+1,d.getDate());
  const raw=[
    ["김OO","010-0000-0001","울산광역시 남구 삼산로 261 (삼산동, 현대백화점 울산점) 13F","CGM EMCG-2404 (M8)","풋 레스트 리클라이닝 불량 / 발 롤러 조치 필요",iso(d0),"10:00","배정완료","900001","샘플 · 오전 첫 방문"],
    ["이OO","010-0000-0002","울산광역시 동구 봉수로 290 (전하동, e편한세상 전하) 115동 902호","CGM MB-1701조합 (V6 Brown)","본체외관이상 / 점검",iso(d0),"13:00","배정완료","900002","샘플 · 남구에서 동구로 이동"],
    ["박OO","010-0000-0003","울산광역시 북구 신천로 27 (신천동, 극동스타클래스) 111-1404호","CGM MB-1901조합 (V4 Charcoal)","내부투광기 수직 작동불량",iso(d1),"10:00","배정완료","900003","샘플 · 유상 건"],
    ["최OO","010-0000-0004","울산광역시 중구 태화로 100 (태화동)","CGM MB-2401 01 (V9 시그니처)","리클라이너 작동불량",iso(d1),"15:00","배정완료","900004","샘플"],
    ["정OO","010-0000-0005","울산광역시 남구 문수로 377 (옥동) 1층","CGM EMCG-2401 (M6)","에어 불량 / 메인보드 확인 요청","","","미확정","900005","샘플 · 예약 없는 날"]
  ];
  S.items=raw.map((r,i)=>{
    const place=resolvePlace(r[2],"");
    return {k:statusOf(r[7])||"up",no:r[8],name:r[0],addr:r[2],tel:telOf(r[1]),gu:place.gu,dong:place.dong,
      model:r[3],sym:r[4],note:r[9],date:r[5]?{iso:r[5]}:null,time:r[6],
      pos:place.pos?{lat:place.pos[0],lng:place.pos[1],exact:false}:null,_i:i};
  });
  S.file=null;S.sheet=null;S.sheets=[];S.coordMap=null;S.sample=true;
  S.mapping={no:0,name:0,addr:0,tel:0,date:0,time:0,gu:0,dong:0,model:0,sym:0,note:0,status:0};
  S.gu="전체";S.mode="up";S.day=null;S.sel=null;S.route=false;
  renderAll();fitVisible(true);startGeocode();
}

/* ── 렌더 ─────────────────────────────────────────────────────────── */
function renderAll(){
  drawBar();drawSide();renderPins();updateAsof();syncHead();
  const lg=$("#legend");if(lg)lg.hidden=!S.items.length;
}
function updateAsof(){
  const a=$("#asof");
  if(!S.items.length){a.textContent=S.sample?"샘플 데이터":"엑셀 파일을 열어 주세요";return}
  const up=S.items.filter(i=>i.k==="up").length,pend=S.items.filter(i=>i.k==="pending").length;
  const next=S.items.filter(i=>i.k==="up"&&isDay(i)).sort((x,y)=>dayOrd(x.date.iso)-dayOrd(y.date.iso)||((mins(x.time)||0)-(mins(y.time)||0)))[0];
  let t="예정 "+up+(pend?" · 미확정 "+pend:"");
  if(next) t="다음 "+labelOf(next.date.iso)+(next.time?" "+next.time:"")+" · "+t;
  a.textContent=t;
}

/* ── 시트 높이(지도/목록 비율) ────────────────────────────────────── */
const SPLIT_KEY="sharemap.split",SPLIT_DEF=55,SPLIT_LIST=24;
let splitR=SPLIT_DEF;
function splitApply(r,save){
  splitR=Math.min(78,Math.max(18,+r||SPLIT_DEF));
  document.querySelector("main").style.setProperty("--map-r",splitR);
  document.body.classList.toggle("mapsmall",splitR<=45);
  const b=$("#splitBig");
  if(b){b.textContent=splitR<=45?"지도 크게":"목록 크게";b.setAttribute("aria-pressed",splitR<=45?"true":"false")}
  if(save){try{localStorage.setItem(SPLIT_KEY,String(splitR))}catch(e){}}
  setTimeout(()=>{map.invalidateSize();syncHead()},30);
}
(function splitInit(){let v=NaN;try{v=parseFloat(localStorage.getItem(SPLIT_KEY)||"")}catch(e){}
  splitApply(isFinite(v)?v:SPLIT_DEF,false)})();
$("#splitBig").onclick=e=>{e.stopPropagation();splitApply(splitR<=45?SPLIT_DEF:SPLIT_LIST,true)};
(function splitter(){
  const sp=$("#splitter");let D=null;
  sp.addEventListener("pointerdown",e=>{
    if(e.target.closest(".sbtn")) return;
    D={y:e.clientY,r:splitR,id:e.pointerId};sp.classList.add("on");document.body.classList.add("splitting");
    try{sp.setPointerCapture(e.pointerId)}catch(_){}
  });
  sp.addEventListener("pointermove",e=>{
    if(!D||e.pointerId!==D.id) return;
    const dh=window.innerHeight*0.01;
    splitApply(D.r-(e.clientY-D.y)/dh,false);
  });
  const end=e=>{if(!D)return;D=null;sp.classList.remove("on");document.body.classList.remove("splitting");splitApply(splitR,true)};
  sp.addEventListener("pointerup",end);sp.addEventListener("pointercancel",end);
  sp.addEventListener("keydown",e=>{
    if(e.key==="ArrowUp"){e.preventDefault();splitApply(splitR+5,true)}
    if(e.key==="ArrowDown"){e.preventDefault();splitApply(splitR-5,true)}
    if(e.key==="Enter"){e.preventDefault();splitApply(splitR<=45?SPLIT_DEF:SPLIT_LIST,true)}
  });
})();
window.addEventListener("resize",()=>{map.invalidateSize();syncHead()});

/* ── 시작 ─────────────────────────────────────────────────────────── */
setTimeout(function(){try{map.invalidateSize();syncHead();fitUlsan()}catch(e){}},60);
renderAll();
})();
