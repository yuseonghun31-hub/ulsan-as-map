# index.html(형님 지도)이나 users/*.json 이 바뀌면 동료 지도(u-○○.html)를 자동으로 다시 만든다.
# 손으로 tools/make_page.py 돌리는 걸 잊어도 동료 지도가 옛 버전으로 남지 않게 하는 안전장치.
# (이미 다시 만든 파일을 같이 올렸으면 바뀐 게 없어서 아무것도 하지 않는다)
name: 동료 지도 자동 생성

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "users/**"
      - "geo/**"
      - "tools/make_page.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: make-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 동료 지도 다시 만들기
        run: python tools/make_page.py

      - name: 바뀐 게 있으면 올리기
        run: |
          if git diff --quiet; then
            echo "동료 지도가 이미 최신입니다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add u-*.html
          git commit -m "동료 지도 자동 생성 (index.html 변경 반영)"
          git push
