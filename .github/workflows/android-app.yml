# android/ 폴더가 바뀌면 GitHub이 '울산 AS 지도' 앱(APK)을 빌드해서
# Releases에 올린다 → 폰에서 그 링크로 바로 내려받아 설치.
name: 안드로이드 앱 빌드

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 서명 키는 저장소(공개)에 두지 않고 GitHub 비밀값에서 꺼낸다.
      # 저장소 Settings → Secrets and variables → Actions → ANDROID_KEYSTORE_B64
      # (원본은 형님 PC: 문서\my-agent\앱서명키 — 잃어버리면 다음 앱은 지우고 새로 깔아야 함)
      - name: 서명 키 고정 (매번 같은 키라야 다시 깔 때 지우지 않고 업데이트됨)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::GitHub 비밀값 ANDROID_KEYSTORE_B64 가 없습니다 (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KS" | base64 -d > /dev/null   # 값이 망가졌으면 여기서 멈춘다

      - name: APK 빌드
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: gradle -p android assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ulsan-as-map.apk

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: 울산 AS 지도 앱 v${{ github.run_number }}
          body: 폰에서 ulsan-as-map.apk를 받아 설치하세요. (처음 한 번 '출처를 알 수 없는 앱 허용' 필요)
          files: ulsan-as-map.apk
          make_latest: true
