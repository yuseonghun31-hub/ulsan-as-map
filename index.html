<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>울산 AS 지도</title>
<meta name="theme-color" content="#111615" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="울산 AS 지도">
<meta name="description" content="울산 AS 방문 일정과 동선 지도">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 배치: 위에 조작 줄, 가운데 구·동 경계 지도, 아래(넓은 화면은 오른쪽)에 동별 목록 */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#18211f; --muted:#62706c; --line:#d5dcd9;
  --accent:#0b6b5c; --accent-ink:#ffffff; --done:#8b9793; --warn:#b4530a;
  --nam:#dcebe2; --jung:#e9e3d2; --buk:#dbe5ee; --dong:#eadfe4; --edge:#ffffff; --gu-ink:#3c4b47;
  --font-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111615; --panel:#1a2120; --ink:#e7eeeb; --muted:#96a39f; --line:#2e3a37;
    --accent:#4fd1b5; --accent-ink:#06211c; --done:#6f7c78; --warn:#f0a35a;
    --nam:#1f3229; --jung:#33301f; --buk:#1f2d3a; --dong:#33242b; --edge:#111615; --gu-ink:#b8c6c1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111615; --panel:#1a2120; --ink:#e7eeeb; --muted:#96a39f; --line:#2e3a37;
  --accent:#4fd1b5; --accent-ink:#06211c; --done:#6f7c78; --warn:#f0a35a;
  --nam:#1f3229; --jung:#33301f; --buk:#1f2d3a; --dong:#33242b; --edge:#111615; --gu-ink:#b8c6c1;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
header{padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:var(--panel)}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.01em}
.asof{color:var(--muted);font-size:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
button.chip{font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.chip:focus-visible,.row:focus-visible,.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.chip .n{opacity:.75;font-variant-numeric:tabular-nums;margin-left:3px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.mapwrap{position:relative;flex:1 1 55%;min-height:260px;background:var(--bg);overflow:hidden;touch-action:none}
svg#map{width:100%;height:100%;display:block;cursor:grab}
svg#map.drag{cursor:grabbing}
.dongshape{stroke:var(--edge);stroke-width:1.2;vector-effect:non-scaling-stroke}
.g-nam{fill:var(--nam)} .g-jung{fill:var(--jung)} .g-buk{fill:var(--buk)} .g-dong{fill:var(--dong)}
.dimgu{opacity:.35}
.dlabel{fill:var(--muted);text-anchor:middle;pointer-events:none;font-family:var(--font-body)}
.glabel{fill:var(--gu-ink);text-anchor:middle;pointer-events:none;font-family:var(--font-display);opacity:.55}
.pt{cursor:pointer}
.pt circle{stroke:var(--panel);vector-effect:non-scaling-stroke;stroke-width:1.5}
.pt.up circle{fill:var(--accent)}
.pt.done circle{fill:var(--done)}
.pt.sel circle{stroke:var(--warn);stroke-width:3}
.pt text{font-family:var(--font-body);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-linejoin:round;pointer-events:none}
.pt.done text{font-weight:500;fill:var(--muted)}
.pt.unv circle{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.pt.unv.sel circle{stroke:var(--warn);stroke-width:3}
.vm{font-size:11px;margin-left:4px;font-weight:600}
.vm.ok,.vline.ok{color:var(--accent)} .vm.unv{color:var(--muted)} .vm.bad,.vline.bad{color:var(--warn)}
.asof.warn{color:var(--warn);cursor:pointer;text-decoration:underline dotted}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);display:flex;gap:12px;align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.side{flex:1 1 45%;min-height:0;overflow:auto;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px 20px}
.card{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
.card .nm{font-size:17px;font-weight:600}
.card .meta{color:var(--muted);font-size:13px}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.card a,.card button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);background:transparent;text-decoration:none;cursor:pointer}
.card a.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4px}
h2 b{color:var(--ink);font-family:var(--font-display);font-weight:400;font-size:16px}
.dg{margin:0 0 6px}
.dg .dn{font-weight:600;font-size:13px;margin:8px 0 2px}
.dg .dn span{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:baseline;padding:5px 6px;border-radius:6px;cursor:pointer;border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%}
.row:hover{background:var(--bg)}
.row.sel{background:var(--bg);box-shadow:inset 3px 0 0 var(--warn)}
.row .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
.row .who{font-weight:600}
.row.done .who{font-weight:400}
.row .sym{color:var(--muted);font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.row .mdl{color:var(--muted);font-size:12px;white-space:nowrap}
.pill{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:6px;font-weight:400}
.pill.up{border-color:var(--accent);color:var(--accent)}
.note{color:var(--muted);font-size:12px;margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.rline{fill:none;stroke:var(--warn);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;opacity:.85;pointer-events:none}
.rline.est{stroke-dasharray:6 5;opacity:.55}
.rnum{pointer-events:none}
.rnum circle{fill:var(--warn);stroke:var(--panel);stroke-width:1.5;vector-effect:non-scaling-stroke}
.rnum text{fill:var(--panel);text-anchor:middle;font-family:var(--font-body);font-weight:600}
.rdays{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.rset{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.rset label{display:flex;align-items:center;gap:5px}
.rset select,.rset input[type=time],.rset input[type=number]{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.rset input[type=number]{width:58px}
.rsum{font-weight:600;margin:4px 0 6px}
.rwarn{color:var(--warn);font-size:12.5px;margin-bottom:6px}
.rrow{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:start;padding:5px 4px;border-radius:6px}
.rrow.sel{background:var(--bg);box-shadow:inset 3px 0 0 var(--warn)}
.rn{width:20px;height:20px;border-radius:50%;background:var(--warn);color:var(--panel);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:2px}
.rn.off{background:transparent;border:1px solid var(--line);color:var(--muted)}
.rmain{border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer;min-width:0}
.rmain .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rt{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
.rt.fx{color:var(--accent);font-weight:600}
.rmain .who{font-weight:600}
.rmain .mdl,.rmain .sym,.rmeta{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.rmeta.bad{color:var(--warn)}
.ract{font:inherit;font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.ract.add{border-color:var(--accent);color:var(--accent)}
.rmain:focus-visible,.ract:focus-visible,.rset select:focus-visible,.rset input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side{position:relative}
.rrow{transition:transform .12s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.rrow.drag{transition:none;background:var(--panel);box-shadow:0 4px 14px rgba(0,0,0,.28);position:relative;z-index:5}
.rn.grip{cursor:grab;touch-action:none;width:24px;height:24px;margin-top:0}
.rrow.drag .rn.grip{cursor:grabbing}
.rtip{color:var(--muted);font-size:12px;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (min-width:860px){
  main{flex-direction:row}
  .mapwrap{flex:1 1 62%}
  .side{flex:0 0 360px;border-top:0;border-left:1px solid var(--line)}
}
@media (prefers-reduced-motion:no-preference){ .row{transition:background .12s} }
/* ── PIN 잠금 화면 ───────────────────────────────────────────── */
html.locked,html.locked body{overflow:hidden}
.gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.gate[hidden]{display:none}
.gcard{width:100%;max-width:330px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 22px 18px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.14)}
.gcard .ico{width:58px;height:58px;margin:0 auto 12px;border-radius:15px;display:block}
.gcard h2{display:block;font-family:var(--font-display);font-weight:400;font-size:21px;color:var(--ink);margin:0 0 5px;padding:0;border:0}
.gcard .gsub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.gcard input{width:100%;font:inherit;font-size:19px;letter-spacing:.3em;text-align:center;padding:11px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.gcard input+input{margin-top:8px}
.gcard input:focus{outline:2px solid var(--accent);outline-offset:1px}
.gcard #pinok{width:100%;margin-top:12px;font:inherit;font-size:15px;font-weight:600;padding:12px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.gcard #pinok:disabled{opacity:.6}
.gcard .gerr{color:var(--warn);font-size:12.5px;min-height:17px;margin-top:8px;-webkit-text-size-adjust:100%}
.gcard .glink{display:inline-block;width:auto;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:4px 0 0;margin:0 0 0 6px;text-decoration:underline dotted;cursor:pointer}
.gate #newpin,.gate #pincancel{display:none}
.gate.chg #newpin,.gate.chg #pincancel{display:block}
.gate.chg #pinchg{display:none}
button.mini{margin-left:auto;font:inherit;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
button.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 홈 화면 앱(standalone)으로 열었을 때 상태바·홈 인디케이터 자리 확보 */
@media all and (display-mode:standalone){
  header{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .side{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .zoom{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .legend{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <div class="gcard">
    <img class="ico" src="icon-192.png" alt="">
    <h2>울산 AS 지도</h2>
    <p class="gsub" id="gsub">PIN을 입력하면 지도가 열립니다</p>
    <input id="pinin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="PIN">
    <input id="newpin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="새 PIN (숫자 4~12자리)">
    <button id="pinok" type="button">열기</button>
    <div class="gerr" id="pinerr"></div>
    <button id="pinchg" class="glink" type="button">PIN 바꾸기</button><button id="pincancel" class="glink" type="button">취소</button>
  </div>
</div>
<header>
  <div class="top"><h1>울산 AS 동선 지도</h1><span class="asof" id="asof" title="눌러서 새로고침">시트 불러오는 중…</span><button id="lockbtn" class="mini" type="button" title="잠그고 PIN 다시 묻기">잠금</button></div>
  <div class="bar" id="bar"></div>
</header>
<main>
  <div class="mapwrap" id="wrap">
    <svg id="map" role="img" aria-label="울산 남구·중구·북구·동구 동 경계 지도와 방문 위치"></svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>예정</span><span><i style="background:var(--done)"></i>완료</span></div>
    <div class="zoom"><button id="zin" aria-label="확대">+</button><button id="zout" aria-label="축소">−</button><button id="zfit" aria-label="전체 보기" style="font-size:13px">전체</button></div>
  </div>
  <div class="side" id="side"></div>
</main>
<script>
// ── 데이터 서버(Apps Script) + PIN 잠금 ─────────────────────────────────
// PIN 값은 이 파일에 넣지 않는다. 사용자가 입력한 PIN을 서버가 검증하고,
// 맞을 때만 시트 자료를 돌려준다.
const API="https://script.google.com/macros/s/AKfycby_bjghGkQ7xZVVBLLAbqJicy7QQAnpw_NXPTwflw2Yhwne0J-yQDjWltXWoQxv6XH3Lw/exec";
const PKEY="asmap.pin";
let PIN="";
function pinLoad(){try{PIN=localStorage.getItem(PKEY)||""}catch(e){PIN=""}return PIN}
function pinSave(v){PIN=v;try{localStorage.setItem(PKEY,v)}catch(e){}}
function pinForget(){PIN="";try{localStorage.removeItem(PKEY)}catch(e){}}
function parseJSON(t){try{return JSON.parse(t)}catch(e){return null}}
function apiGet(q,pin){const u=API+"?"+q+(pin?"&pin="+encodeURIComponent(pin):"");
  return fetch(u,{cache:"no-store"}).then(r=>r.text()).then(parseJSON)}

    if(!/^\d{4,12}$/.test(n)){gEl("pinerr").textContent="새 PIN은 숫자 4~12자리로 정해주세요";return}
    btn.disabled=true;
    apiGet("action=setPin&newPin="+encodeURIComponent(n),v).then(res=>{btn.disabled=false;
      if(!res){gEl("pinerr").textContent=NO_SERVER;return}
      if(res.unauthorized){gEl("pinerr").textContent=res.locked?"시도가 많아 잠시 잠겼습니다. 잠시 뒤 다시 해보세요.":"지금 쓰는 PIN이 맞지 않습니다";return}
      if(res.ok!==true){gEl("pinerr").textContent=res.error||"PIN을 바꾸지 못했습니다";return}
      pinSave(n);setPinMode(false);hideGate();sheetState="wait";setAsof();loadMap(true)
    }).catch(()=>{btn.disabled=false;gEl("pinerr").textContent=NO_SERVER});
    return;
  }
  if(!/^\d{4,12}$/.test(v)){gEl("pinerr").textContent="PIN을 입력해주세요";return}
  btn.disabled=true;
  apiGet("action=data",v).then(res=>{btn.disabled=false;
    if(!res){gEl("pinerr").textContent=NO_SERVER+" · 잠시 뒤 다시 해보세요";return}
    if(res.unauthorized){gEl("pinerr").textContent=res.locked?"시도가 많아 잠시 잠겼습니다. 잠시 뒤 다시 해보세요.":"PIN이 맞지 않습니다";return}
    if(res.ok!==true){gEl("pinerr").textContent=res.error||"시트를 읽지 못했습니다";return}
    pinSave(v);takeData(res);lastAt=Date.now();hideGate();setAsof();rebuild();fit(state.gu||"전체")
  }).catch(()=>{btn.disabled=false;gEl("pinerr").textContent=NO_SERVER+" · 잠시 뒤 다시 해보세요"});
}
function takeData(res){
  if(res.up)takeUp(res.up);if(res.done)takeDone(res.done);
  if(!sheetAt&&res.at)sheetAt=res.at;
  applyGeoRows(res.geo);applyLegRows(res.legs);
  if(res.route&&(!rsAt||(res.route.at||0)>rsAt)){takeRS(res.route)}
  sheetState="live";sheetErr="";
}
function loadMap(show){
  if(!PIN){showGate("");return}
  if(loading)return;loading=true;if(show){sheetState="wait";setAsof()}
  apiGet("action=data",PIN).then(res=>{
    loading=false;lastAt=Date.now();
    if(!res){sheetState="err";sheetErr="응답 형식 오류";setAsof();rebuild();return}
    if(res.unauthorized){pinForget();sheetState="wait";setAsof();rebuild();showGate(res.locked?"시도가 많아 잠시 잠겼습니다. 잠시 뒤 다시 해보세요.":"");return}
    if(res.ok!==true){sheetState="err";sheetErr=res.error||"알 수 없는 오류";setAsof();rebuild();return}
    takeData(res);setAsof();rebuild()
  }).catch(()=>{loading=false;if(sheetState!=="live"){sheetState="err";sheetErr="서버에 연결하지 못했습니다"}setAsof();rebuild()})
}
document.getElementById("asof").addEventListener("click",()=>loadMap(true));
document.getElementById("lockbtn").addEventListener("click",()=>{pinForget();sheetState="wait";setAsof();rebuild();showGate("")});
document.getElementById("pinok").addEventListener("click",gateSubmit);
document.getElementById("pinin").addEventListener("keydown",e=>{if(e.key==="Enter")gateSubmit()});
document.getElementById("newpin").addEventListener("keydown",e=>{if(e.key==="Enter")gateSubmit()});
document.getElementById("pinchg").addEventListener("click",()=>setPinMode(true));
document.getElementById("pincancel").addEventListener("click",()=>setPinMode(false));
setInterval(()=>{if(PIN&&!document.hidden)loadMap(false)},600000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&PIN&&Date.now()-lastAt>180000)loadMap(false)});
if(navigator.serviceWorker&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
pinLoad();
rebuild();fit("전체");
if(PIN){hideGate();loadMap(true)}else{showGate("")}
</script>
</body>
</html>
