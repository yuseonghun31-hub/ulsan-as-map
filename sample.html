<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>울산 AS (샘플)</title>
<meta name="theme-color" content="#0e1316" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eceeed" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="울산 AS 샘플">
<meta name="description" content="가접수 샘플 — 울산 AS 방문 일정과 동선 지도(시연용 가상 자료)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── 토큰: 절제된 딥그린 + 차콜, 유리(글래스) 표면 ─────────────────────── */
:root{
  --bg:#eceeed; --panel:#ffffff; --panel-2:#f5f6f5; --ink:#0e1412; --muted:#69756f; --line:rgba(14,24,20,.10);
  --accent:#0d5a49; --accent-ink:#ffffff; --accent-soft:rgba(13,90,73,.10);
  --done:#64748b; --warn:#9f561a; --warn-soft:rgba(159,86,26,.12);
  /* 지도 점 색: 예약된 요일별 — 어두운 지도에서 작은 점으로도 한눈에 갈리는 고대비 7색.
     카드의 방문일시 배지도 같은 값을 쓴다(요일 하나 = 색 하나). */
  --p-mon:#3b82f6;  /* 월 선명한 파랑 */
  --p-tue:#22c55e;  /* 화 선명한 초록 */
  --p-wed:#facc15;  /* 수 쨍한 노랑 */
  --p-thu:#f97316;  /* 목 선명한 주황 */
  --p-fri:#a855f7;  /* 금 선명한 보라 */
  --p-sat:#f472b6;  /* 토 선명한 분홍 */
  --p-sun:#ef4444;  /* 일 선명한 빨강 */
  --p-free:#ffffff; --p-free-ring:rgba(8,16,13,.55);
  --cmp:#06b6d4;  /* 두 지점 비교 선·뱃지 — 월요일 파랑(#3b82f6)과 갈리는 청록 */
  --glass:rgba(255,255,255,.74); --glass-drop:rgba(255,255,255,.42); --glass-line:rgba(255,255,255,.55);
  --sheet:#ffffff; --sheet-h:42vh;
  --sh-1:0 1px 2px rgba(12,22,18,.05),0 1px 1px rgba(12,22,18,.04);
  --sh-2:0 2px 8px rgba(12,22,18,.06),0 12px 28px rgba(12,22,18,.09);
  --sh-3:0 -1px 0 rgba(12,22,18,.04),0 -12px 34px rgba(12,22,18,.13);
  --nam:#cfe4d9; --jung:#eee1c4; --buk:#d5e2ee; --dong:#efd3dd; --edge:#aab8b3; --gu-ink:#33413c;
  --fillop:.5; --jn:#8497a8; --jnl:#9db0c0; --bs:#9c96b4; --bsl:#b3aec8; --uj:#8ba396; --ujl:#a4b8ab;
  --tnam-bg:#e6f1ec; --tnam-ink:#14614c; --tjung-bg:#f8f0dc; --tjung-ink:#7a5a16;
  --tbuk-bg:#e8eef6; --tbuk-ink:#2b5474; --tdong-bg:#f9e9ef; --tdong-ink:#7d3550;
  --tetc-bg:#eef0ef; --tetc-ink:#5c6864;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1316; --panel:#151c21; --panel-2:#1a2329; --ink:#e9eeec; --muted:#8d9a98; --line:rgba(255,255,255,.09);
    --accent:#7cc0a6; --accent-ink:#07130f; --accent-soft:rgba(124,192,166,.14);
    --done:#64748b; --warn:#d9a06a; --warn-soft:rgba(217,160,106,.14);
    --glass:rgba(18,25,29,.72); --glass-drop:rgba(18,25,29,.34); --glass-line:rgba(255,255,255,.07);
    --sheet:#121920;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 10px rgba(0,0,0,.45),0 14px 30px rgba(0,0,0,.35);
    --sh-3:0 -1px 0 rgba(255,255,255,.05),0 -12px 34px rgba(0,0,0,.5);
    --nam:#1e3931; --jung:#3a3324; --buk:#20313c; --dong:#372831; --edge:#0a1013; --gu-ink:#cdd8d4;
    --fillop:.62; --jn:#2b3a48; --jnl:#3c4f60; --bs:#332e45; --bsl:#443e59; --uj:#27382f; --ujl:#35493f;
    --tnam-bg:rgba(124,192,166,.16); --tnam-ink:#93cfb8; --tjung-bg:rgba(216,186,120,.14); --tjung-ink:#dcc088;
    --tbuk-bg:rgba(124,166,214,.14); --tbuk-ink:#9dc0e2; --tdong-bg:rgba(214,140,168,.14); --tdong-ink:#e0a8bd;
    --tetc-bg:rgba(255,255,255,.06); --tetc-ink:#94a1a0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1316; --panel:#151c21; --panel-2:#1a2329; --ink:#e9eeec; --muted:#8d9a98; --line:rgba(255,255,255,.09);
  --accent:#7cc0a6; --accent-ink:#07130f; --accent-soft:rgba(124,192,166,.14);
  --done:#64748b; --warn:#d9a06a; --warn-soft:rgba(217,160,106,.14);
  --glass:rgba(18,25,29,.72); --glass-drop:rgba(18,25,29,.34); --glass-line:rgba(255,255,255,.07);
  --sheet:#121920;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 10px rgba(0,0,0,.45),0 14px 30px rgba(0,0,0,.35);
  --sh-3:0 -1px 0 rgba(255,255,255,.05),0 -12px 34px rgba(0,0,0,.5);
  --nam:#1e3931; --jung:#3a3324; --buk:#20313c; --dong:#372831; --edge:#0a1013; --gu-ink:#cdd8d4;
  --fillop:.62; --jn:#2b3a48; --jnl:#3c4f60; --bs:#332e45; --bsl:#443e59; --uj:#27382f; --ujl:#35493f;
  --tnam-bg:rgba(124,192,166,.16); --tnam-ink:#93cfb8; --tjung-bg:rgba(216,186,120,.14); --tjung-ink:#dcc088;
  --tbuk-bg:rgba(124,166,214,.14); --tbuk-ink:#9dc0e2; --tdong-bg:rgba(214,140,168,.14); --tdong-ink:#e0a8bd;
  --tetc-bg:rgba(255,255,255,.06); --tetc-ink:#94a1a0;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow:hidden;letter-spacing:-.005em}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}

/* ── 지도: 화면 전체를 쓰는 풀스크린 ──────────────────────────────────── */
main{position:absolute;inset:0;overflow:hidden;--bleed:0px}
.mapwrap{position:absolute;left:0;right:0;top:0;bottom:0;
  background:var(--bg);overflow:hidden;touch-action:none;z-index:1}
svg#map{width:100%;height:100%;display:block;cursor:grab}
svg#map.drag{cursor:grabbing}
.dongshape{stroke:var(--edge);stroke-width:1;vector-effect:non-scaling-stroke;fill-opacity:var(--fillop)}
.g-nam{fill:var(--nam)} .g-jung{fill:var(--jung)} .g-buk{fill:var(--buk)} .g-dong{fill:var(--dong)}
#map image.tile{pointer-events:none}
.reg{stroke-width:1;vector-effect:non-scaling-stroke;fill-opacity:.12;stroke-opacity:.35}
.reg.gyeongnam{fill:var(--jn);stroke:var(--jnl)} .reg.busan{fill:var(--bs);stroke:var(--bsl)} .reg.ulju{fill:var(--uj);stroke:var(--ujl)}
#map .donglayer{filter:drop-shadow(0 1px 2px rgba(20,34,29,.35))}
:root[data-theme="dark"] #map .donglayer{filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #map .donglayer{filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}}
.rlabel{fill:var(--muted);text-anchor:middle;pointer-events:none;font-family:var(--font);opacity:.55;letter-spacing:.04em}
.ulab{fill:var(--accent);text-anchor:middle;pointer-events:none;font-family:var(--font);font-weight:700;opacity:.45;letter-spacing:.3em}
.dimgu{opacity:.3}
.dlabel{fill:var(--muted);text-anchor:middle;pointer-events:none;font-family:var(--font);opacity:.8}
.glabel{fill:var(--gu-ink);text-anchor:middle;pointer-events:none;font-family:var(--font);font-weight:700;opacity:.42;letter-spacing:.06em}
/* 어두운 화면에서는 동·시군구 이름이 배경에 묻히지 않게 조금 밝힌다 */
:root[data-theme="dark"] .dlabel{fill:#b9c6c2;opacity:.7}
:root[data-theme="dark"] .rlabel{fill:#9aa8a4;opacity:.6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dlabel{fill:#b9c6c2;opacity:.7}
  :root:not([data-theme="light"]) .rlabel{fill:#9aa8a4;opacity:.6}}

/* 핀: 둥근 점 + 얇은 링, 라벨은 캡슐 배지 */
.pt{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}  /* 탭하면 브라우저가 점 주위에 두꺼운 흰 테두리를 그리던 것(포커스 링)을 없앤다 */
.pt .hit{fill:transparent;stroke:none}
.pt .dot{stroke:var(--panel);stroke-width:2;vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 1px 2px rgba(16,28,24,.28))}
.pt.up .dot,.pt.up .ldot{fill:var(--accent)}
.pt.up.dow-mon .dot,.pt.up.dow-mon .ldot{fill:var(--p-mon)}
.pt.up.dow-tue .dot,.pt.up.dow-tue .ldot{fill:var(--p-tue)}
.pt.up.dow-wed .dot,.pt.up.dow-wed .ldot{fill:var(--p-wed)}
.pt.up.dow-thu .dot,.pt.up.dow-thu .ldot{fill:var(--p-thu)}
.pt.up.dow-fri .dot,.pt.up.dow-fri .ldot{fill:var(--p-fri)}
.pt.up.dow-sat .dot,.pt.up.dow-sat .ldot{fill:var(--p-sat)}
.pt.up.dow-sun .dot,.pt.up.dow-sun .ldot{fill:var(--p-sun)}
.pt.up.free .dot{fill:var(--p-free);stroke:var(--p-free-ring);stroke-width:1.6}
.pt.up.free .ldot{fill:var(--p-free)}
.pt.done .dot{fill:var(--done);stroke-width:1.6}
.pt.done .ldot{fill:var(--done)}
/* 선택한 점은 요일 색을 그대로 두고 테두리만 짙은 슬레이트로 — 캡슐과 한 몸처럼 보인다 */
.pt.sel .dot{stroke:rgba(20,26,34,.92);stroke-width:2}
/* 캡슐 안의 작은 요일 점은 선택한 핀에서만 보인다 */
.pt .ldot{display:none;stroke:none}
.pt.sel .ldot{display:inline}
.pt .lbl{fill:var(--panel);fill-opacity:.93;stroke:rgba(14,24,20,.10);stroke-width:1;vector-effect:non-scaling-stroke}
:root[data-theme="dark"] .pt .lbl{stroke:rgba(255,255,255,.09)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pt .lbl{stroke:rgba(255,255,255,.09)}}
/* 선택 핀 이름표: 두꺼운 흰 링 대신 짙은 슬레이트 캡슐 + 요일 색 1.5px 슬림 테두리 + 부드러운 그림자 */
.pt .lbl.sel{fill:rgba(20,26,34,.94);fill-opacity:1;stroke:rgba(255,255,255,.16);stroke-width:1.5;
  vector-effect:non-scaling-stroke;stroke-linejoin:round;filter:drop-shadow(0 4px 12px rgba(0,0,0,.45))}
.pt.sel.dow-mon .lbl.sel{stroke:rgba(59,130,246,.78)}
.pt.sel.dow-tue .lbl.sel{stroke:rgba(34,197,94,.78)}
.pt.sel.dow-wed .lbl.sel{stroke:rgba(250,204,21,.85)}
.pt.sel.dow-thu .lbl.sel{stroke:rgba(249,115,22,.80)}
.pt.sel.dow-fri .lbl.sel{stroke:rgba(168,85,247,.78)}
.pt.sel.dow-sat .lbl.sel{stroke:rgba(244,114,182,.78)}
.pt.sel.dow-sun .lbl.sel{stroke:rgba(239,68,68,.80)}
.pt text{font-family:var(--font);font-weight:600;fill:var(--ink);letter-spacing:-.01em;pointer-events:none}
/* 이름표는 전화가 아니다 — 점이든 이름표든 누르면 아래 정보란이 열린다 */
.pt.done text{font-weight:500;fill:var(--muted)}
.pt.sel text{fill:#fff;font-weight:600}
/* 키보드로 고를 때만 보이는 얇은 초점 테두리(터치·마우스에는 보이지 않는다) */
.pt:focus-visible .lbl{stroke:var(--accent);stroke-width:1.5}

/* 경로 선 */
.rline{fill:none;stroke:var(--warn);stroke-width:2.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;opacity:.9;pointer-events:none}
.rline.est{stroke-dasharray:1 7;opacity:.75}
.rline.case{stroke:var(--panel);stroke-width:6;opacity:.5}
.rline.est.case{stroke-dasharray:none;opacity:.3}
/* 두 지점 비교: ①→② 선·뱃지·가운데 거리 글자 (실측은 실선, 어림은 점선) */
:root[data-theme="dark"]{--cmp:#22d3ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cmp:#22d3ee}}
.cmp-line{fill:none;stroke:var(--cmp);stroke-width:2.8;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.cmp-line.case{stroke:var(--panel);stroke-width:6.5;opacity:.85}
.cmp-line.est{stroke-dasharray:7 6}
.cmpm-t{fill:var(--cmp);font-family:var(--font);font-weight:700;text-anchor:middle;pointer-events:none;font-variant-numeric:tabular-nums}
.cmpm-b{fill:var(--panel);stroke:var(--cmp);stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.96}   /* 거리 글자 뒤 캡슐 — 도로 선이 글자를 지나지 않게 */
.cn{pointer-events:none}
.cn circle{fill:var(--cmp);stroke:var(--panel);stroke-width:1.6;vector-effect:non-scaling-stroke}
.cn text{fill:#fff;text-anchor:middle;font-family:var(--font);font-weight:700}
:root[data-theme="dark"] .cn text{fill:#06272c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cn text{fill:#06272c}}
.rnum{pointer-events:none}
.rnum circle{fill:var(--warn);stroke:var(--panel);stroke-width:1.5;vector-effect:non-scaling-stroke}
.rnum text{fill:#fff;text-anchor:middle;font-family:var(--font);font-weight:700}
:root[data-theme="dark"] .rnum text{fill:#0b110f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rnum text{fill:#0b110f}}

/* 지도 위 부유 컨트롤 */
.zoom{position:absolute;right:12px;bottom:calc(var(--sheet-h,0px) + 12px);display:flex;flex-direction:column;gap:8px;z-index:2}
.zoom button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.10);
  background:rgba(18,25,29,.62);backdrop-filter:blur(8px) saturate(160%);-webkit-backdrop-filter:blur(8px) saturate(160%);
  color:var(--ink);font-family:inherit;font-size:17px;font-weight:500;line-height:1;padding:0;cursor:pointer;
  box-shadow:0 1px 3px rgba(0,0,0,.28),0 6px 16px rgba(0,0,0,.22);transition:transform .12s ease,background .18s ease}
:root[data-theme="light"] .zoom button{background:rgba(255,255,255,.78);border-color:rgba(14,24,20,.10)}
.zoom button:active{transform:scale(.94)}
.zoom button.zf{font-size:11.5px;font-weight:600;letter-spacing:-.04em}
.zoomrow{display:flex;gap:8px}
.zoomrow button{flex:0 0 auto}
/* 내 위치 단추 — 같은 유리 질감, 켜져 있으면 파란 기운 */
.zoom button.zloc{display:flex;align-items:center;justify-content:center;color:var(--ink)}
.zoom button.zloc svg{width:19px;height:19px;display:block}
.zoom button.zloc[aria-pressed="true"]{color:#0e7490;background:rgba(6,182,212,.20);border-color:rgba(6,182,212,.48)}
.zoom button.zloc[aria-pressed="true"] svg{filter:drop-shadow(0 0 5px rgba(6,182,212,.55))}
:root[data-theme="light"] .zoom button.zloc[aria-pressed="true"]{background:rgba(6,182,212,.16);border-color:rgba(6,182,212,.45)}
:root[data-theme="dark"] .zoom button.zloc[aria-pressed="true"]{color:#67e8f9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .zoom button.zloc[aria-pressed="true"]{color:#67e8f9}}
/* 지도 위 내 위치: 청록 점 + 흰 테두리 + 은은한 정확도 반경·펄스 (크기는 화면 기준으로 보정)
   월요일 예약 점이 파랑이라, 내 위치는 청록으로 살짝 갈라 두고 점을 눌러 ① 출발점으로 잡을 수 있게 한다 */
.me{pointer-events:none}
.me *{pointer-events:none}
.me .hit2{fill:transparent;stroke:none;pointer-events:all;cursor:pointer}   /* 투명한 터치 원 — 채움을 비우지 않으면 검게 칠해진다 */
.me .halo{fill:#06b6d4;fill-opacity:.12;stroke:rgba(6,182,212,.38);stroke-width:1;vector-effect:non-scaling-stroke}
.me .pulse{fill:#06b6d4;fill-opacity:.22;transform-box:fill-box;transform-origin:center}
.me .ring{fill:#fff;filter:drop-shadow(0 1px 2.5px rgba(0,0,0,.32))}
.me .dot2{fill:#06b6d4}
.me.sel .ring{stroke:#06b6d4;stroke-width:3;vector-effect:non-scaling-stroke}   /* ① 출발점으로 잡힌 내 위치: 점 둘레에 청록 테두리(화면 3px 고정) */
@media (prefers-reduced-motion:no-preference){
  .me .pulse{animation:mePulse 2.6s cubic-bezier(.22,.61,.36,1) infinite}
}
@keyframes mePulse{0%{transform:scale(.5);opacity:.6}70%{transform:scale(1.6);opacity:0}100%{transform:scale(1.6);opacity:0}}
/* 안내 토스트 — 지도 아래 시트 위에 잠깐 떴다 사라진다 */
.toast{position:fixed;left:50%;bottom:calc(var(--sheet-h,0px) + 18px);transform:translate(-50%,8px);z-index:40;
  max-width:min(88vw,430px);padding:10px 14px;border-radius:12px;background:rgba(18,25,29,.93);color:#fff;
  font-size:12.5px;line-height:1.52;letter-spacing:-.01em;box-shadow:0 6px 22px rgba(0,0,0,.35);
  opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast[hidden]{display:none}
@media (min-width:860px){.toast{bottom:18px;left:calc(50% - 210px)}}
.attr{color:var(--muted);font-size:10px;text-decoration:none;opacity:.62;white-space:nowrap}
.attr:active{opacity:1}
/* 범례는 작은 칩으로 접혀 있고, 누를 때만 펼쳐진다 */
.legendwrap{position:absolute;left:12px;bottom:calc(var(--sheet-h,0px) + 12px);z-index:2;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:calc(100% - 130px)}
.legend{background:rgba(18,25,29,.78);backdrop-filter:blur(8px) saturate(160%);-webkit-backdrop-filter:blur(8px) saturate(160%);
  border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--muted);
  display:flex;gap:5px 10px;align-items:center;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  max-width:100%;line-height:1.5}
.legend[hidden]{display:none}
:root[data-theme="light"] .legend{background:rgba(255,255,255,.9);border-color:rgba(14,24,20,.10)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.legend i.free{background:var(--p-free);box-shadow:inset 0 0 0 1px var(--p-free-ring)}
.legend .lg-br{flex-basis:100%;height:0}
.lgfoot{display:flex;align-items:center;gap:8px}
.lgbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;
  border:1px solid rgba(255,255,255,.10);background:rgba(18,25,29,.62);backdrop-filter:blur(8px) saturate(160%);
  -webkit-backdrop-filter:blur(8px) saturate(160%);color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;
  letter-spacing:-.01em;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.28),0 6px 16px rgba(0,0,0,.22);transition:transform .12s ease,color .18s ease}
:root[data-theme="light"] .lgbtn{background:rgba(255,255,255,.78);border-color:rgba(14,24,20,.10)}
.lgbtn:active{transform:scale(.96)}
.lgbtn[aria-expanded="true"]{color:var(--ink)}
.lgbtn .sw{width:11px;height:11px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(var(--p-mon) 0 14%,var(--p-tue) 14% 28%,var(--p-wed) 28% 43%,var(--p-thu) 43% 57%,var(--p-fri) 57% 72%,var(--p-sat) 72% 86%,var(--p-sun) 86% 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.mapwrap.far .legendwrap{top:calc(var(--head-h,148px) + 8px);bottom:auto}

/* ── 상단 유리 헤더 ────────────────────────────────────────────────── */
header{position:absolute;left:0;right:0;top:0;z-index:30;
  padding:calc(6px + env(safe-area-inset-top,0px)) 12px 7px;
  background:linear-gradient(180deg,var(--glass) 0%,var(--glass) 62%,var(--glass-drop) 100%);
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);
  border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:6px;min-width:0}
h1{font-size:13.5px;font-weight:700;margin:0;letter-spacing:-.03em;white-space:nowrap;flex:0 0 auto}
.asof{color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1 1 auto;text-align:right;letter-spacing:-.01em;cursor:pointer;padding-left:4px}
.asof.warn{color:var(--warn)}
.asof:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 샘플 배지: 실제 자료와 헷갈리지 않게 제목 옆에 작게 붙인다 */
.smp{flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:6px;
  background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-soft);line-height:1.35}

/* ⚙ 설정 단추 + 팝오버: 자주 안 쓰는 기능은 여기 깔끔하게 모아 둔다 */
.gear{flex:0 0 auto;width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
  font-family:inherit;font-size:15px;line-height:1;cursor:pointer;transition:transform .12s,background .18s,color .18s}
.gear:active{transform:scale(.94)}
.gear[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu{position:absolute;right:10px;top:calc(100% - 4px);z-index:40;min-width:196px;padding:5px;
  background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2);
  display:flex;flex-direction:column;gap:1px}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;width:100%;text-align:left;font:inherit;font-size:13.5px;font-weight:600;
  letter-spacing:-.02em;padding:11px 11px;border-radius:10px;border:0;background:none;color:var(--ink);cursor:pointer}
.menu button:active{background:var(--panel-2)}
.menu button .st{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted);padding-left:12px}
.menu button[aria-pressed="true"] .st{color:var(--accent)}
.menu .sep{height:1px;background:var(--line);margin:4px 8px}

/* 필터 칩: 유리 위 2줄(날짜 → 지역구), 가로 스크롤 */
.bar{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.chiprow{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:1px 0}
.chiprow::-webkit-scrollbar{display:none}
.chiprow.acts{gap:6px}
button.chip{flex:0 0 auto;font:inherit;font-size:11.5px;font-weight:600;letter-spacing:-.015em;padding:0 10px;height:27px;
  display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .12s ease,background .18s ease,color .18s ease,border-color .18s ease}
button.chip:active{transform:scale(.96)}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(13,90,73,.25)}
button.chip.act{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
button.chip.act[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip .n{opacity:.55;font-variant-numeric:tabular-nums;margin-left:4px;font-weight:600}
button.chip[aria-pressed="true"] .n{opacity:.75}
button.chip:focus-visible,.sbtn:focus-visible,.cardrow:focus-visible,.ract:focus-visible,
.rset select:focus-visible,.rset input:focus-visible,.rmain:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 아래 시트: 지도(위)와 목록·정보(아래)를 한 화면에서, 높이는 손가락으로 ── */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:24;display:flex;flex-direction:column;
  height:var(--sheet-h,42vh);background:var(--sheet);
  border-radius:20px 20px 0 0;box-shadow:0 -1px 0 rgba(12,22,18,.05),0 -14px 40px rgba(12,22,18,.16);
  transition:height .24s cubic-bezier(.22,.8,.26,1);will-change:height;overflow:hidden}
.sheet.dragging{transition:none}
.sheet.dragging,.sheet.dragging *{ -webkit-user-select:none !important; user-select:none !important;
  -webkit-touch-callout:none !important}
.shead{flex:0 0 auto;padding:0 12px 5px;border-bottom:1px solid var(--line);background:var(--sheet);
  border-radius:20px 20px 0 0;touch-action:none;cursor:grab;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sheet.dragging .shead{cursor:grabbing}
.shead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.grip{height:22px;margin:0 -12px;display:flex;align-items:center;justify-content:center}
.grip::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--ink);opacity:.22}
.ssum{display:flex;align-items:center;gap:7px;min-height:28px;padding:0 1px 1px}
.ssum b{font-size:14.5px;font-weight:700;letter-spacing:-.03em;flex:0 0 auto}
.ssum .sn{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums;flex:0 0 auto;white-space:nowrap}
.ssum .sd{font-size:11.5px;color:var(--muted);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.ssum .stg{margin-left:auto;flex:0 0 auto;font-size:13px;color:var(--muted);line-height:1;padding:6px 0 6px 8px;opacity:.85}
.sbody{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;-ms-overflow-style:none;
  padding:12px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sbody::-webkit-scrollbar{display:none}
/* 시트 맨 위 한 줄 비교 배너: ① 김정화 → ② 박지훈 | 2.4km · 약 8분 [×] */
.cmpbar{flex:0 0 auto;display:flex;align-items:center;gap:5px;height:33px;padding:0 8px 0 12px;
  border-bottom:1px solid var(--line);background:var(--accent-soft);font-size:11.5px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden}
.cmpbar[hidden]{display:none}
.cmpbar b{font-weight:700;min-width:0;max-width:31%;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.03em}
.cmpbar .cnum{flex:0 0 auto;width:16px;height:16px;border-radius:50%;background:var(--cmp);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .cmpbar .cnum{color:#06272c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cmpbar .cnum{color:#06272c}}
.cmpbar .ar{flex:0 0 auto;color:var(--muted);font-size:10.5px}
.cmpbar .dist{margin-left:auto;flex:0 0 auto;padding-left:8px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cmpbar .hint{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:11px}
.cmpbar .cx{flex:0 0 auto;width:23px;height:23px;margin-left:3px;padding:0;border:0;border-radius:50%;
  background:var(--panel-2);color:var(--muted);font-size:13px;line-height:1;cursor:pointer}
.cmpbar .cx:active{transform:scale(.92)}
/* 시트가 화면을 거의 덮을 때: 범례 칩은 숨기고 지도 출처 표기만 남기며, 지도 단추는 한 줄로 */
main.tight .legendwrap{gap:0}
main.tight .lgbtn,main.tight .legend{display:none}
main.tight .lgfoot .attr{font-size:10px;opacity:.8}
main.tight .zoom{flex-direction:row;align-items:center;gap:6px}
main.tight .zoom .zoomrow{gap:6px;flex-direction:row}

h2{font-size:12.5px;font-weight:600;color:var(--muted);margin:16px 2px 9px;display:flex;align-items:baseline;
  justify-content:space-between;letter-spacing:-.01em}
h2:first-child{margin-top:2px}
h2 b{color:var(--ink);font-weight:700;font-size:14.5px;letter-spacing:-.03em}
h2 span{font-variant-numeric:tabular-nums;font-size:11.5px}

/* 고객 카드 */
.cardrow{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:11px 12px 12px;margin:0 0 9px;cursor:pointer;
  box-shadow:var(--sh-1);transition:transform .13s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease}
.cardrow:active{transform:scale(.987);box-shadow:none}
.cardrow.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--sh-2)}
.cardrow.done{background:var(--panel);box-shadow:none;border-color:var(--line);opacity:.94}
.cr-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.badge{display:inline-flex;align-items:center;flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:-.01em;
  padding:3px 7px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.badge.done{background:var(--panel-2);color:var(--muted);border:1px solid var(--line);font-weight:600}
.badge.tel{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:600}
/* 방문일시 배지: 요일별 색 — 지도 점과 같은 7색을 그대로 쓴다.
   흰 글씨는 노랑·초록·주황에서 묻히므로, 일곱 색 모두 어두운 글씨(#0b1220, 대비 5.1~13.7:1)로 올린다 */
:root{--d-mon:#3b82f6;--d-mon-i:#0b1220;--d-tue:#22c55e;--d-tue-i:#0b1220;--d-wed:#facc15;--d-wed-i:#0b1220;
  --d-thu:#f97316;--d-thu-i:#0b1220;--d-fri:#a855f7;--d-fri-i:#0b1220;--d-sat:#f472b6;--d-sat-i:#0b1220;--d-sun:#ef4444;--d-sun-i:#0b1220;
  --d-unv-bg:#e4ede9;--d-unv-ink:#33564b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --d-unv-bg:rgba(124,192,166,.13);--d-unv-ink:#9fd0bb}}
:root[data-theme="dark"]{
  --d-unv-bg:rgba(124,192,166,.13);--d-unv-ink:#9fd0bb}
.badge.dow-mon{background:var(--d-mon);color:var(--d-mon-i)}
.badge.dow-tue{background:var(--d-tue);color:var(--d-tue-i)}
.badge.dow-wed{background:var(--d-wed);color:var(--d-wed-i)}
.badge.dow-thu{background:var(--d-thu);color:var(--d-thu-i)}
.badge.dow-fri{background:var(--d-fri);color:var(--d-fri-i)}
.badge.dow-sat{background:var(--d-sat);color:var(--d-sat-i)}
.badge.dow-sun{background:var(--d-sun);color:var(--d-sun-i)}
.badge.unv{background:var(--d-unv-bg);color:var(--d-unv-ink);border:1px solid var(--line);font-weight:600}
.gtag{font-size:10.5px;font-weight:600;letter-spacing:-.01em;padding:3px 7px;border-radius:7px;white-space:nowrap}
.gtag.g-nam{background:var(--tnam-bg);color:var(--tnam-ink)}
.gtag.g-jung{background:var(--tjung-bg);color:var(--tjung-ink)}
.gtag.g-buk{background:var(--tbuk-bg);color:var(--tbuk-ink)}
.gtag.g-dong{background:var(--tdong-bg);color:var(--tdong-ink)}
.gtag.g-etc{background:var(--tetc-bg);color:var(--tetc-ink)}
.mtag{margin-left:auto;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:10.5px;font-weight:500;color:var(--muted);padding:3px 7px;border-radius:7px;background:var(--panel-2);
  border:1px solid var(--line);letter-spacing:-.01em}
.cr-name{font-size:15.5px;font-weight:650;letter-spacing:-.03em;line-height:1.25;color:var(--ink)}
.cr-sym{margin-top:3px;font-size:12px;line-height:1.5;color:var(--muted);letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 고객 이름은 누르면 아래 정보란이 열린다(전화는 정보란 안에서) */
.cr-name{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* 선택한 고객 1건 — 시트 맨 위에 한 장. 위쪽 지도에서는 같은 점이 이름표와 함께 강조된다 */
@media (prefers-reduced-motion:no-preference){.sbody .card{animation:cardin .18s cubic-bezier(.2,.8,.25,1)}}
@keyframes cardin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.card{position:relative;border:1px solid var(--line);border-radius:16px;padding:11px 12px 13px;margin:0 0 12px;
  display:flex;flex-direction:column;gap:5px;background:var(--panel);box-shadow:var(--sh-1)}
.card .kv{display:flex;gap:8px;font-size:12.5px;line-height:1.45;letter-spacing:-.01em}
.card .kv b{flex:0 0 auto;min-width:30px;color:var(--muted);font-weight:600}
.card .kv span{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.card .kv.col{flex-direction:column;gap:2px}
.card .kv span.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.card .more{align-self:flex-start;font:inherit;font-size:11.5px;font-weight:700;color:var(--accent);
  background:none;border:0;padding:2px 0;cursor:pointer;letter-spacing:-.01em}
.card .nm{font-size:17px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:7px;min-width:0}
/* 이름 줄 오른쪽 빈 곳의 작은 전화 버튼 — 이름이 길면 이름만 말줄임해 배지·버튼과 한 줄을 지킨다 */
.card .nm .nmname{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .nm .badge{flex:0 0 auto}
.card .nm a.calltop{margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;
  min-height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--accent);
  background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;
  letter-spacing:-.01em;line-height:1;text-decoration:none;white-space:nowrap;
  -webkit-tap-highlight-color:transparent}
.card .nm a.calltop:active{transform:scale(.96);background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* 이름은 세라젬 MAS 접수 상세로 가는 링크(새 탭) — 이름만 말줄임하고 ↗ 는 끝에 남긴다 */
.card .nm a.namelink{flex:0 1 auto;min-width:0;display:inline-flex;align-items:center;gap:2px;
  padding:0;border:0;border-radius:0;background:none;color:inherit;font:inherit;font-size:inherit;
  font-weight:inherit;letter-spacing:inherit;line-height:inherit;text-decoration:none}
.card .nm a.namelink .nmtxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .nm a.namelink .ext{flex:0 0 auto;font-size:12px;font-weight:700;line-height:1;color:var(--muted);opacity:.9}
.card .nm a.namelink:active{transform:none;color:var(--accent)}
.card .nm a.namelink:active .ext{color:var(--accent);opacity:1}
.card .meta{color:var(--muted);font-size:12.5px;letter-spacing:-.01em}
.card .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.card a,.card button{font:inherit;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:11px;
  border:1px solid var(--line);color:var(--ink);background:var(--panel-2);text-decoration:none;cursor:pointer;
  transition:transform .12s ease,background .18s ease}
.card a:active,.card button:active{transform:scale(.97)}
.card a.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* 상세 카드 머리: 무엇을 연 건지 + 오른쪽 위 ✕ 닫기(터치 44px 이상) */
.card .chead{display:flex;align-items:center;gap:8px;margin:0 0 3px}
.card .chead .clab{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--accent)}
.card .chead .xclose{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;min-width:88px;padding:0 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.card .chead .xclose:active{transform:scale(.97);background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.card .chead .xclose .xi{font-size:15px;font-weight:700;line-height:1}
/* 상세 카드 안의 번호는 전화 링크 — 버튼 모양 대신 글자 그대로 둔다 */
.card a.tellink{color:var(--ink);font-weight:650;background:none;border:0;padding:0;border-radius:0;
  font-size:inherit;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;
  text-decoration-color:var(--accent)}
.card .acts a.callnow{font-variant-numeric:tabular-nums}
.pill{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.up{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.note{color:var(--muted);font-size:11px;line-height:1.65;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);opacity:.85}

/* ── 밤/낮·상세 이동 같은 보조 단추 ────────────────────────────────── */
.rset{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.rset label{display:flex;align-items:center;gap:6px}
.rset select,.rset input[type=time],.rset input[type=number]{font:inherit;font-size:12.5px;color:var(--ink);
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:4px 7px}
.rset input[type=number]{width:56px}
.rsum{font-weight:600;font-size:13px;margin:6px 0 8px;letter-spacing:-.02em}
.rwarn{color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:7px 10px;font-size:12px;margin-bottom:8px}
.rrow{display:grid;grid-template-columns:24px 1fr auto;gap:9px;align-items:start;padding:9px 8px;border-radius:12px;
  border:1px solid transparent;transition:background .15s ease}
.rrow+.rrow{margin-top:2px}
.rrow.sel{background:var(--panel-2);border-color:var(--line)}
.rn{width:21px;height:21px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;
  font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.rn.off{background:transparent;border:1px solid var(--line);color:var(--muted)}
.rmain{border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer;min-width:0}
.rmain .l1{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.rt{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted)}
.rt.fx{color:var(--accent);font-weight:700}
.rmain .who{font-weight:650;font-size:13.5px;letter-spacing:-.02em}
.rmain .mdl,.rmain .sym,.rmeta{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.rmeta.bad{color:var(--warn)}
.ract{font:inherit;font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .12s ease}
.ract:active{transform:scale(.96)}
.ract.add{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rrow{transition:transform .12s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.rrow.drag{transition:none;background:var(--panel);box-shadow:0 6px 20px rgba(0,0,0,.18);position:relative;z-index:5}
.rn.grip{cursor:grab;touch-action:none}
.rrow.drag .rn.grip{cursor:grabbing}
.rtip{color:var(--muted);font-size:11.5px;margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dn{font-weight:700;font-size:12.5px;letter-spacing:-.01em;margin:16px 2px 4px;display:flex;gap:6px;align-items:baseline}
.dn span{color:var(--muted);font-weight:500;font-size:11px;font-variant-numeric:tabular-nums}

/* ── PIN 잠금 화면 ────────────────────────────────────────────────── */
html.locked,html.locked body{overflow:hidden}
.gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 90% at 50% 0%,var(--panel) 0%,var(--bg) 62%)}
.gate[hidden]{display:none}
.gcard{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:24px;
  padding:26px 22px 18px;text-align:center;box-shadow:0 18px 60px rgba(10,20,16,.16)}
.gcard .ico{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:block;box-shadow:var(--sh-2)}
.gcard h2{display:block;font-size:19px;font-weight:700;color:var(--ink);margin:0 0 6px;padding:0;border:0;
  letter-spacing:-.03em;justify-content:center}
.gcard .gsub{color:var(--muted);font-size:12px;margin:0 0 16px;letter-spacing:-.01em}
.gcard input{width:100%;font:inherit;font-size:17px;font-weight:600;letter-spacing:.35em;text-align:center;
  padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
  font-variant-numeric:tabular-nums}
.gcard input::placeholder{letter-spacing:.02em;font-weight:400;font-size:13px;color:var(--muted)}
.gcard input+input{margin-top:9px}
.gcard input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gcard #pinok{width:100%;margin-top:14px;font:inherit;font-size:14.5px;font-weight:700;padding:13px;border-radius:14px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;
  transition:transform .12s ease,opacity .18s}
.gcard #pinok:active{transform:scale(.985)}
.gcard #pinok:disabled{opacity:.55}
.gcard .gerr{color:var(--warn);font-size:12px;min-height:17px;margin-top:9px;-webkit-text-size-adjust:100%;letter-spacing:-.01em}
.gcard .glink{display:inline-block;width:auto;background:none;border:0;color:var(--muted);font:inherit;font-size:11.5px;
  padding:4px 0 0;margin:0 0 0 6px;text-decoration:underline dotted;cursor:pointer}
.gate #newpin,.gate #pincancel{display:none}
.gate.chg #newpin,.gate.chg #pincancel{display:block}
.gate.chg #pinchg{display:none}

/* ── 넓은 화면: 지도는 화면 전체, 목록은 오른쪽 패널 ──────────────────── */
@media (min-width:860px){
  .asof{flex:0 1 auto;text-align:left;margin-left:6px;max-width:460px}
  .sheet{left:auto;right:14px;bottom:14px;width:420px;border-radius:18px;transition:none;
    height:calc(100% - var(--head-h,116px) - 28px);box-shadow:var(--sh-2)}
  .sheet .grip{display:none}
  .sheet .shead{cursor:default;padding-top:9px}
  .zoom{bottom:14px;right:calc(420px + 26px)}   /* 단추가 오른쪽 패널 뒤에 숨지 않게 패널 왼쪽에 둔다 */
  .legendwrap{bottom:14px}
}
@media (prefers-reduced-motion:no-preference){
  .cardrow,.chip,.zoom button{will-change:transform}
}

/* ── 샘플 시연: MAS 접수 상세 미리보기 · 전화 연결 ── */
.demo-bg{position:fixed;inset:0;z-index:9000;background:rgba(6,12,10,.55);display:flex;align-items:flex-end;justify-content:center;
  animation:dfade .18s ease-out}
.demo-bg[hidden]{display:none}
@keyframes dfade{from{opacity:0}to{opacity:1}}
@keyframes dup{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.mas{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:#f4f5f7;color:#1d2024;border-radius:20px 20px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.35);animation:dup .22s ease-out;font-size:14px}

.mas .top{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#c8102e;color:#fff;position:sticky;top:0}
.mas .top b{font-size:16px;letter-spacing:-.02em}.mas .top small{opacity:.85;font-size:12px;margin-left:auto}
.mas .top button{border:0;background:rgba(255,255,255,.18);color:#fff;width:30px;height:30px;border-radius:50%;font-size:15px}
.mas .tag{margin:12px 16px 0;padding:8px 12px;border-radius:10px;background:#fff4d6;color:#7a5300;font-size:12.5px;line-height:1.45}
.mas .sec{margin:12px 16px;background:#fff;border-radius:12px;border:1px solid #e4e6ea;overflow:hidden}
.mas .sec h4{font-size:13px;color:#5b6270;padding:10px 14px;border-bottom:1px solid #eef0f3;background:#fafbfc}
.mas .row{display:flex;padding:9px 14px;border-bottom:1px solid #f1f2f4;gap:12px}.mas .row:last-child{border-bottom:0}
.mas .row span:first-child{flex:0 0 74px;color:#7b8290}.mas .row span:last-child{flex:1;font-weight:600;word-break:keep-all}
.mas .st{display:inline-block;padding:2px 8px;border-radius:6px;background:#e7f0ff;color:#1a56db;font-weight:700;font-size:12.5px}
.mas .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 18px}
.mas .btns button{height:44px;border-radius:10px;border:1px solid #d5d8de;background:#fff;font-weight:700;font-size:14px;color:#1d2024}
.mas .btns button.pri{background:#c8102e;border-color:#c8102e;color:#fff}
.call{width:100%;max-width:520px;background:linear-gradient(180deg,#123a2f,#0a1f19);color:#fff;border-radius:22px 22px 0 0;
  padding:34px 24px 26px;text-align:center;animation:dup .22s ease-out}

@keyframes blink{50%{opacity:.2}}

.call button{margin-top:20px;width:64px;height:64px;border-radius:50%;border:0;background:#e53935;color:#fff;font-size:26px}

<script>
/* ── 샘플 시연 화면: 가상 번호로 실제 전화가 걸리지 않게, 이름은 MAS 접수 상세 미리보기로 ── */
(function(){
  const bg=document.createElement("div");bg.className="demo-bg";bg.hidden=true;document.body.appendChild(bg);
  const close=()=>{bg.hidden=true;bg.textContent=""};
  bg.addEventListener("click",e=>{if(e.target===bg)close()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!bg.hidden)close()});
  const mk=(t,c,p,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(p)p.appendChild(e);return e};
  const find=v=>(typeof items!=="undefined"?items:[]).find(i=>i.ph&&String(v).replace(/\D/g,"")===String(i.ph).replace(/\D/g,""));
  const dash=p=>String(p||"").replace(/^(\d{3})(\d{3,4})(\d{4})$/,"$1-$2-$3");
  window.callDemo=function(ph){const it=find(ph);bg.textContent="";const c=mk("div","call",bg);
    mk("div","av",c,"📞");mk("b",null,c,(it&&it.name?it.name+" 고객":"고객"));mk("div","num",c,dash(ph));
    const g=mk("div","ing",c,"전화 연결 중 ");mk("i",null,g,"●●●");
    mk("div","note",c,"샘플 번호라 실제로는 걸리지 않습니다. 실제 지도앱에서는 이 버튼 한 번으로 바로 통화가 연결됩니다.");
    const x=mk("button",null,c,"✕");x.type="button";x.setAttribute("aria-label","닫기");x.onclick=close;bg.hidden=false};
  window.masDemo=function(it){bg.textContent="";const m=mk("div","mas",bg);
    const t=mk("div","top",m);mk("b",null,t,"세라젬 MAS · 접수 상세");mk("small",null,t,"샘플 미리보기");
    const x=mk("button",null,t,"✕");x.type="button";x.setAttribute("aria-label","닫기");x.onclick=close;
    mk("div","tag",m,"실제 지도앱에서는 고객 이름을 누르면 MAS가 이 접수 건 화면으로 바로 열립니다 (로그인 상태 유지). 여기서 처리이력 작성 · 완료 · 결제를 이어서 합니다.");
    const sec=(h,rows)=>{const s=mk("div","sec",m);mk("h4",null,s,h);rows.forEach(([k,v,st])=>{if(!v)return;const r=mk("div","row",s);mk("span",null,r,k);const vv=mk("span",null,r);if(st)mk("em","st",vv,v);else vv.textContent=v})};
    const when=it.k==="up"?(it.date==="미확정"?"미확정 (방문일 협의 중)":it.date+" "+(it.time||"")):it.date+" 완료";

    sec("고객 · 제품",[["고객명",it.name],["연락처",dash(it.ph)],["설치주소",it.addr],["제품",it.model],["불량증상",it.sym||"-"]]);
    if(it.memo)sec("에이전트 메모",[["메모",it.memo]]);
    const b=mk("div","btns",m);
    [["처리이력 작성",""],["임시저장",""],["결제",""],["처리완료","pri"]].forEach(([l,c])=>{const bt=mk("button",c,b,l);bt.type="button";
      bt.onclick=()=>{if(typeof toast==="function")toast("샘플 화면입니다 — 실제 MAS에서 이어서 처리합니다",2600)}});
    bg.hidden=false};
  // tel: 링크는 모두 시연 화면으로 (가상 번호로 실제 발신 방지)
