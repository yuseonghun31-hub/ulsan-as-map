<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 위치 390px 검증</title>
<style>
  html,body{margin:0;background:#20262b}
  iframe{display:block;width:390px;height:844px;border:0;background:#0e1316}
</style>
</head>
<body>
<iframe id="f" title="울산 AS 지도 390px 내 위치 검증"></iframe>
<script>
  // 검증용 임시 페이지 — index.html 을 390×844 틀에 넣고, 위치만 흉내 낸다.
  //   ?mode=click (기본) 단추를 눌러 켜는 길 / ?mode=auto 열 때 조용히 켜지는 길 / ?mode=deny 권한 거부
  var MODE = new URLSearchParams(location.search).get('mode') || 'click';
  var DENY = MODE === 'deny';
  try {
    if (MODE === 'auto') localStorage.setItem('asmap.geo', '1');
    else localStorage.removeItem('asmap.geo');
  } catch (e) {}
  var ANSWER = DENY ? 'err({code:1,message:"User denied Geolocation"})' : 'ok(pos)';
  var STUB = '<script>(function(){'
    + 'var pos={coords:{latitude:35.5384,longitude:129.3265,accuracy:24,heading:null,speed:null,altitude:null},timestamp:Date.now()};'
    + 'var g={getCurrentPosition:function(ok,err){setTimeout(function(){' + ANSWER + '},140)},'
    + 'watchPosition:function(ok,err){setTimeout(function(){' + ANSWER + '},140);return 7},'
    + 'clearWatch:function(){}};'
    + 'try{Object.defineProperty(navigator,"geolocation",{value:g,configurable:true})}catch(e){}'
    + 'try{Object.defineProperty(navigator,"permissions",{value:{query:function(){return Promise.resolve({state:"' + (DENY ? 'denied' : 'granted') + '"})}},configurable:true})}catch(e){}'
    + '})();<\/script>';
  fetch('index.html?v=' + Date.now()).then(function (r) { return r.text(); }).then(function (t) {
    document.getElementById('f').srcdoc = t.replace('<head>', '<head>' + STUB);
  });
</script>
</body>
</html>
