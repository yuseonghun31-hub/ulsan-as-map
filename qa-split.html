<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>split QA (임시)</title>
<style>
 html,body{margin:0;height:100%;font:12px/1.45 system-ui,sans-serif;background:#555;display:flex;gap:12px;align-items:flex-start;padding:8px;box-sizing:border-box}
 iframe{width:390px;height:760px;border:1px solid #000;background:#fff;flex:0 0 auto}
 aside{color:#fff;background:#222;border-radius:8px;padding:10px;width:280px}
 aside pre{white-space:pre-wrap;word-break:break-all;margin:0}
</style></head>
<body>
<iframe id="f" src="index.html"></iframe>
<aside><pre id="out">준비 중…</pre></aside>
<script>
const f=document.getElementById('f'), out=document.getElementById('out');
function read(){
  const d=f.contentDocument, w=f.contentWindow;
  if(!d || !d.querySelector('main')) return;
  const m=d.querySelector('main'), mp=d.getElementById('wrap'), sd=d.getElementById('side'), sp=d.getElementById('splitter'), btn=d.getElementById('splitBig');
  const svg=d.getElementById('map');
  out.textContent=[
    'frame '+w.innerWidth+'x'+w.innerHeight,
    'main h '+Math.round(m.getBoundingClientRect().height),
    'map h '+Math.round(mp.getBoundingClientRect().height),
    'side h '+Math.round(sd.getBoundingClientRect().height),
    'split h '+Math.round(sp.getBoundingClientRect().height),
    'map-r '+getComputedStyle(m).getPropertyValue('--map-r'),
    'aria '+sp.getAttribute('aria-valuenow'),
    'btn "'+btn.textContent+'" pressed='+btn.getAttribute('aria-pressed'),
    'ls '+JSON.stringify(localStorage.getItem('asmap.split')),
    'viewBox '+svg.getAttribute('viewBox'),
    'side scroll '+Math.round(sd.scrollTop)+' / '+sd.scrollHeight
  ].join('\n');
}
f.addEventListener('load',()=>{
  const d=f.contentDocument;
  d.getElementById('gate').hidden=true; d.documentElement.classList.remove('locked');
  const side=d.getElementById('side'); side.textContent='';
  for(let i=1;i<=9;i++){const r=d.createElement('div');
    r.style.cssText='padding:9px 0;border-bottom:1px dashed #999';
    r.textContent='테스트 접수 '+i+' — 신정동 · H25 · 예약 09:0'+i;
    side.appendChild(r)}
  setTimeout(read,150);
});
setInterval(read,400);
</script>
</body></html>
